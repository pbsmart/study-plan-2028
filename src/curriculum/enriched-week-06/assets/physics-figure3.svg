<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">静摩擦的实际值与上限</title><desc id="d">教学条形对比：最大静摩擦10牛；静止所需摩擦3牛、8牛均可，所需12牛超出上限不可。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.head{font-size:26px;font-weight:bold}.small{font-size:15px}.axis{fill:none;stroke:#718397;stroke-width:1.5}.blue{fill:#2167b2}.orange{fill:#b65c13}.line{fill:none;stroke:#2167b2;stroke-width:3}.dash{stroke-dasharray:5 4}.box{fill:#f2f6fb;stroke:#adbcc9}</style><rect width="1000" height="610" fill="white"/><text x="30" y="40" class="head">实际静摩擦先看“需要多少”</text><text x="30" y="70" class="small">三个独立的静止假设，最大静摩擦都为10 N；不是一条连续运动曲线。</text><rect x="35" y="135" width="300" height="355" rx="7" class="box"/><text x="55" y="185">所需摩擦 3 N</text><path d="M60 260L305 260" class="axis"/><path d="M60 260h54" stroke="#2167b2" stroke-width="12"/><path d="M240 225L240 292" class="axis dash"/><text x="240" y="325" class="small" text-anchor="middle">上限10 N</text><text x="55" y="391">可以保持静止</text><text x="55" y="431" class="small">实际静摩擦 3 N</text><rect x="360" y="135" width="300" height="355" rx="7" class="box"/><text x="380" y="185">所需摩擦 8 N</text><path d="M385 260L630 260" class="axis"/><path d="M385 260h144" stroke="#2167b2" stroke-width="12"/><path d="M565 225L565 292" class="axis dash"/><text x="565" y="325" class="small" text-anchor="middle">上限10 N</text><text x="380" y="391">可以保持静止</text><text x="380" y="431" class="small">实际静摩擦 8 N</text><rect x="685" y="135" width="300" height="355" rx="7" class="box"/><text x="705" y="185">所需摩擦 12 N</text><path d="M710 260L955 260" class="axis"/><path d="M710 260h216" stroke="#b65c13" stroke-width="12"/><path d="M890 225L890 292" class="axis dash"/><text x="890" y="325" class="small" text-anchor="middle">上限10 N</text><text x="705" y="391">超限，静止假设失败</text><text x="705" y="431" class="small">不能强行取12 N</text><text x="40" y="551">转为滑动后重新选模型：fₖ=μₖN；最大静摩擦不能直接当作滑动摩擦。</text></svg>