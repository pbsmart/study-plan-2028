<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="936" viewBox="0 0 1200 936" role="img" aria-labelledby="title desc"><title id="title">反应后浓度的四步账</title><desc id="desc">先用各原液cV求溶质mol，再按电离下标得到参加反应的离子mol；用配平离子方程式算消耗和剩余；最后以剩余离子mol除题给混合后溶液体积。旁观离子也要保留用于电中性检查。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">反应后浓度的四步账</text><text x="32" y="99" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">反应会消耗离子：先扣消耗，最后再求浓度。</text><rect x="70" y="136" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="111" y="190" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">1</text><text x="175" y="181" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">各原液先算溶质的 mol</text><text x="175" y="224" font-size="23" font-weight="400" fill="#162b3d" text-anchor="start">n（溶质）= cV；mol/L 配 L，mL 先换 L。</text><path d="M600,264 L600,282" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="292" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="111" y="346" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">2</text><text x="175" y="337" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">由化学式换成离子的 mol</text><text x="175" y="380" font-size="23" font-weight="400" fill="#162b3d" text-anchor="start">每份溶质提供几个该离子？看下标，不看电荷猜倍数。</text><path d="M600,420 L600,438" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="448" width="1060" height="118" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="111" y="502" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">3</text><text x="175" y="493" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">按配平离子式做量账</text><text x="175" y="536" font-size="23" font-weight="400" fill="#162b3d" text-anchor="start">起始 → 实际消耗 → 剩余；两给量先比较 n / 系数。</text><path d="M600,576 L600,594" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="604" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="111" y="658" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">4</text><text x="175" y="649" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">最后用剩余量求浓度</text><text x="175" y="692" font-size="23" font-weight="400" fill="#162b3d" text-anchor="start">c剩 = n剩 / V终；V终是题给的最终液相溶液体积。</text><rect x="32" y="796" width="1136" height="104" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="56" y="838" font-size="24" font-weight="700" fill="#162b3d" text-anchor="start">末尾核查：原子守恒、总电荷守恒、体积依据和题定近似条件。</text><text x="56" y="877" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">旁观离子没有被反应消耗，但混合后浓度仍可能因体积改变。</text></svg>