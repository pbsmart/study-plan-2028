<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">弹簧形变量是与原长的差</title><desc id="d">三根水平弹簧分别为原长10厘米、伸长后14厘米、压缩后7厘米；对应形变量0、4厘米、3厘米。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.head{font-size:26px;font-weight:bold}.small{font-size:15px}.axis{fill:none;stroke:#718397;stroke-width:1.5}.blue{fill:#2167b2}.orange{fill:#b65c13}.line{fill:none;stroke:#2167b2;stroke-width:3}.dash{stroke-dasharray:5 4}.box{fill:#f2f6fb;stroke:#adbcc9}</style><rect width="1000" height="610" fill="white"/><text x="30" y="40" class="head">弹簧形变量 = 当前长度 − 原长</text><text x="30" y="70" class="small">大小F=k|Δl|，适用于弹性限度内；方向使弹簧恢复原长。</text><path d="M440 120L440 505" class="axis dash"/><text x="440" y="108" class="small" text-anchor="middle">原长末端</text><path d="M80 170L80 220" class="axis"/><path d="M80 195L96.3636 206L112.727 184L129.091 206L145.455 184L161.818 206L178.182 184L194.545 206L210.909 184L227.273 206L243.636 184L260 206L276.364 184L292.727 206L309.091 184L325.455 206L341.818 184L358.182 206L374.545 184L390.909 206L407.273 184L423.636 206L440 195" class="line"/><rect x="440" y="177" width="30" height="36" rx="7" class="box"/><text x="80" y="153">原长10 cm</text><text x="675" y="201">形变量0</text><path d="M80 310L80 360" class="axis"/><path d="M80 335L102.909 346L125.818 324L148.727 346L171.636 324L194.545 346L217.455 324L240.364 346L263.273 324L286.182 346L309.091 324L332 346L354.909 324L377.818 346L400.727 324L423.636 346L446.545 324L469.455 346L492.364 324L515.273 346L538.182 324L561.091 346L584 335" class="line"/><rect x="584" y="317" width="30" height="36" rx="7" class="box"/><text x="80" y="293">拉伸后14 cm</text><text x="675" y="341">伸长4 cm=0.04 m</text><path d="M599 335L499 335" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M499 335L508.0 339.0L508.0 331.0Z" fill="#2167b2"/><text x="539" y="380" class="small" text-anchor="middle">弹力向左</text><path d="M80 450L80 500" class="axis"/><path d="M80 475L91.4545 486L102.909 464L114.364 486L125.818 464L137.273 486L148.727 464L160.182 486L171.636 464L183.091 486L194.545 464L206 486L217.455 464L228.909 486L240.364 464L251.818 486L263.273 464L274.727 486L286.182 464L297.636 486L309.091 464L320.545 486L332 475" class="line"/><rect x="332" y="457" width="30" height="36" rx="7" class="box"/><text x="80" y="433">压缩后7 cm</text><text x="675" y="481">压缩3 cm=0.03 m</text><path d="M362 475L452 475" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M452 475L443.0 471.0L443.0 479.0Z" fill="#b65c13"/><text x="410" y="520" class="small" text-anchor="middle">弹力向右</text><text x="40" y="582">只把变化的长度代入k|Δl|，不能把弹簧总长直接代入。</text></svg>