<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">只画选定物体实际受到的力</title><desc id="d">水平地面上的箱子受到竖直向下重力、向上支持力、向右拉力和向左静摩擦；另用虚线隔离箱子。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.head{font-size:26px;font-weight:bold}.small{font-size:15px}.axis{fill:none;stroke:#718397;stroke-width:1.5}.blue{fill:#2167b2}.orange{fill:#b65c13}.line{fill:none;stroke:#2167b2;stroke-width:3}.dash{stroke-dasharray:5 4}.box{fill:#f2f6fb;stroke:#adbcc9}</style><rect width="1000" height="610" fill="white"/><text x="30" y="40" class="head">受力图只画“别人对研究对象的力”</text><text x="30" y="70" class="small">箱子静止，受水平向右拉力；虚框只标研究对象，不是额外的力。</text><rect x="215" y="280" width="160" height="80" rx="7" class="box"/><path d="M55 370L545 370" class="axis"/><text x="265" y="330">箱子</text><rect x="195" y="255" width="200" height="125" fill="none" stroke="#718397" stroke-dasharray="5 4"/><path d="M295 320L295 165" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M295 165L291.0 174.0L299.0 174.0Z" fill="#2167b2"/><path d="M295 320L295 475" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M295 475L299.0 466.0L291.0 466.0Z" fill="#b65c13"/><path d="M295 320L530 320" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M530 320L521.0 316.0L521.0 324.0Z" fill="#2167b2"/><path d="M295 320L65 320" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M65 320L74.0 324.0L74.0 316.0Z" fill="#b65c13"/><text x="310" y="177" class="small">N：地面对箱子</text><text x="310" y="203" class="small">向上支持</text><text x="315" y="468" class="small">G：地球对箱子</text><text x="315" y="495" class="small">竖直向下</text><text x="415" y="295" class="small">F：绳的拉力</text><text x="40" y="295" class="small">fₛ：地面静摩擦</text><text x="645" y="150" class="orange">不画进箱子受力图</text><path d="M640 280L930 280" class="axis"/><path d="M785 290L785 390" fill="none" stroke="#718397" stroke-width="2.5"/><path d="M785 390L789.0 381.0L781.0 381.0Z" fill="#718397"/><text x="640" y="440">箱子对地面的压力</text><text x="640" y="473">受力对象是地面。</text><text x="40" y="560">逐个箭头检查施力者、受力者与方向；速度箭头不是一种力。</text></svg>