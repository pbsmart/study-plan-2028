<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">支持力会随竖直外力改变</title><desc id="d">三幅接触地面的箱子图，重力均30牛；无竖直外力支持30牛，另有向上8牛支持22牛，另有向下8牛支持38牛。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.head{font-size:26px;font-weight:bold}.small{font-size:15px}.axis{fill:none;stroke:#718397;stroke-width:1.5}.blue{fill:#2167b2}.orange{fill:#b65c13}.line{fill:none;stroke:#2167b2;stroke-width:3}.dash{stroke-dasharray:5 4}.box{fill:#f2f6fb;stroke:#adbcc9}</style><rect width="1000" height="610" fill="white"/><text x="30" y="40" class="head">重力相同，支持力可以不同</text><text x="30" y="70" class="small">三种独立情形均保持接触、竖直速度为0；P为额外竖直外力。</text><text x="175" y="128" text-anchor="middle">无额外竖直力</text><path d="M45 385L305 385" class="axis"/><rect x="133" y="325" width="84" height="60" rx="7" class="box"/><path d="M175 355L175 455" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M175 455L179.0 446.0L171.0 446.0Z" fill="#b65c13"/><path d="M151 355L151 255" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M151 255L147.0 264.0L155.0 264.0Z" fill="#2167b2"/><text x="50" y="215" class="blue">N=30 N</text><text x="180" y="480" class="orange">G=30 N</text><text x="175" y="520" text-anchor="middle">30=30</text><text x="500" y="128" text-anchor="middle">向上拉8 N</text><path d="M370 385L630 385" class="axis"/><rect x="458" y="325" width="84" height="60" rx="7" class="box"/><path d="M500 355L500 455" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M500 455L504.0 446.0L496.0 446.0Z" fill="#b65c13"/><path d="M476 355L476 281.667" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M476 281.667L472.0 290.7L480.0 290.7Z" fill="#2167b2"/><text x="375" y="215" class="blue">N=22 N</text><text x="505" y="480" class="orange">G=30 N</text><text x="500" y="520" text-anchor="middle">22+8=30</text><path d="M530 355L530 328.333" fill="none" stroke="#237c66" stroke-width="2.5"/><path d="M530 328.333L526.0 337.3L534.0 337.3Z" fill="#237c66"/><text x="543" y="302" class="small">P=8 N</text><text x="825" y="128" text-anchor="middle">向下压8 N</text><path d="M695 385L955 385" class="axis"/><rect x="783" y="325" width="84" height="60" rx="7" class="box"/><path d="M825 355L825 455" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M825 455L829.0 446.0L821.0 446.0Z" fill="#b65c13"/><path d="M801 355L801 228.333" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M801 228.333L797.0 237.3L805.0 237.3Z" fill="#2167b2"/><text x="700" y="215" class="blue">N=38 N</text><text x="830" y="480" class="orange">G=30 N</text><text x="825" y="520" text-anchor="middle">38=30+8</text><path d="M855 355L855 381.667" fill="none" stroke="#237c66" stroke-width="2.5"/><path d="M855 381.667L859.0 372.7L851.0 372.7Z" fill="#237c66"/><text x="868" y="413" class="small">P=8 N</text><text x="40" y="575">向上拉分担支持，向下压增加挤压；先求N，再用摩擦模型。</text></svg>