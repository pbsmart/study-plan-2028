<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="813" viewBox="0 0 1200 813" role="img" aria-labelledby="title desc"><title id="title">拆写离子前过三道关</title><desc id="desc">依次检查本题是否水溶液、物质是否确实溶解且为强电解质；本课符合条件的NaCl溶液、盐酸、NaOH溶液写离子。沉淀和固体、气体、水、弱酸保留化学式。浓与稀不决定电解质强弱。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">拆写离子前过三道关</text><text x="32" y="101" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">不是见到酸、碱、盐就拆；这三项要一起检查。</text><rect x="70" y="135" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="112" y="187" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">1</text><text x="175" y="179" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">本题是水溶液情境？</text><text x="175" y="223" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">先读状态：aq 水溶液；s 固体；l 液态；g 气态。</text><path d="M600,263 L600,281" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="291" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="112" y="343" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">2</text><text x="175" y="335" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">该物质实际溶解在水中？</text><text x="175" y="379" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">固相沉淀或尚未溶解的固体，不偷换成 aq。</text><path d="M600,419 L600,437" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="447" width="1060" height="118" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="112" y="499" font-size="38" font-weight="700" fill="#126b83" text-anchor="start">3</text><text x="175" y="491" font-size="28" font-weight="700" fill="#162b3d" text-anchor="start">按本课强电解质处理？</text><text x="175" y="535" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">例如 HCl(aq)、NaOH(aq)、NaCl(aq)；不是按浓稀判断。</text><text x="600" y="608" font-size="28" font-weight="700" fill="#126b83" text-anchor="middle">三项符合 → 按对应离子及份数拆写</text><rect x="32" y="641" width="1136" height="136" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="56" y="684" font-size="24" font-weight="700" fill="#162b3d" text-anchor="start">本课保留：CH₃COOH(aq)、H₂O(l)、AgCl(s)、CO₂(g)、NaOH(s)。</text><text x="56" y="728" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">强弱 ≠ 浓稀；难溶 ≠ 弱电解质。遇到陌生物质，先用题给性质。</text><text x="56" y="761" font-size="21" font-weight="400" fill="#162b3d" text-anchor="start">这里给的是写式规则，不是实验操作流程。</text></svg>