 <title id="math-reciprocal-branches-title">分别递减不是全域递减</title><desc id="math-reciprocal-branches-desc">y=2/x在负半轴与正半轴分别递减，图示截取两支的一部分。跨支取−1&lt;1，输出−2&lt;2，反而升高，故不能说整个定义域递减。x=0未定义，曲线没有连过竖轴。</desc><metadata>
