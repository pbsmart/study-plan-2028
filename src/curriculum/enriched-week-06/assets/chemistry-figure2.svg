<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="title desc"><title id="title">旁观离子不写入净反应，却仍在溶液里</title><desc id="desc">概念示意：Ag⁺与Cl⁻结合生成AgCl固体；Na⁺和NO₃⁻反应前后均保留在水相。删除的是方程式两侧相同的书写项，不是将离子从溶液中移走。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">旁观离子不写入净反应，却仍在溶液里</text><text x="32" y="98" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">只比较反应前后；图示表达计量关系，不是装置或反应机理。</text><rect x="32" y="139" width="484" height="355" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><rect x="684" y="139" width="484" height="355" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="274" y="184" font-size="28" font-weight="700" fill="#162b3d" text-anchor="middle">反应前：水相</text><text x="926" y="184" font-size="28" font-weight="700" fill="#162b3d" text-anchor="middle">反应后</text><rect x="88" y="212" width="156" height="68" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="166" y="258" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">Ag⁺</text><rect x="302" y="212" width="156" height="68" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="380" y="258" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">Cl⁻</text><rect x="88" y="362" width="156" height="68" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="166" y="408" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">Na⁺</text><rect x="302" y="362" width="156" height="68" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="380" y="408" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">NO₃⁻</text><path d="M544,316 L656,316" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><text x="600" y="274" font-size="22" font-weight="600" fill="#162b3d" text-anchor="middle">发生变化</text><text x="926" y="227" font-size="24" font-weight="600" fill="#162b3d" text-anchor="middle">水相仍有旁观离子</text><rect x="740" y="250" width="156" height="68" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="818" y="295" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">Na⁺</text><rect x="954" y="250" width="156" height="68" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="1032" y="295" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">NO₃⁻</text><rect x="755" y="351" width="342" height="100" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="926" y="391" font-size="27" font-weight="700" fill="#162b3d" text-anchor="middle">独立固相：AgCl(s)</text><text x="926" y="429" font-size="23" font-weight="400" fill="#162b3d" text-anchor="middle">由 Ag⁺ 与 Cl⁻ 生成</text><text x="600" y="563" font-size="34" font-weight="700" fill="#126b83" text-anchor="middle">净离子式：Ag⁺ + Cl⁻ → AgCl↓</text><rect x="32" y="609" width="1136" height="106" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="58" y="653" font-size="25" font-weight="600" fill="#162b3d" text-anchor="start">约去的是两侧相同的书写项；Na⁺ 与 NO₃⁻ 并没有从溶液里消失。</text><text x="58" y="693" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">计算全部离子或检查整体电中性时，旁观离子仍须计入。</text></svg>