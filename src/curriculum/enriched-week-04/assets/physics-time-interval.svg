<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="title desc"><title id="title">教学图：最后一秒是梯形区域</title><desc id="desc">通用速度—时间图，直线从原点到触地前时刻T，纵轴为向下速度v，横轴为时间t。标出T−1秒与T之间的窄梯形区域，其左侧速度不为0。T处标首次触地，右侧只写后续需要碰撞信息，不延长图线。</desc><rect width="1000" height="610" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#111"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:20px}.title{font-size:27px;font-weight:700}.small{font-size:18px}.strong{font-weight:700}</style>
<text x="25" y="43" class="title">教学图：最后一秒是梯形区域</text>
<text x="25" y="80" class="small">示意取 T &gt; 1 s，T 是首次触地时刻；图线表示速度，不是下落轨迹。</text>
<polygon points="560,400 560,216.0655737704918 730,145 730,400" fill="#ddd"/>
<line x1="120" y1="400" x2="120" y2="105" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="120" y1="400" x2="910" y2="400" stroke="#111" stroke-width="2" marker-end="url(#arrow)"/>
<text x="27" y="121" class="small">v / (m/s)</text>
<text x="917" y="427" class="small">t / s</text>
<line x1="120" y1="400" x2="730" y2="145" stroke="#111" stroke-width="4"/>
<line x1="730" y1="400" x2="730" y2="145" stroke="#111" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="560" y1="400" x2="560" y2="216.0655737704918" stroke="#111" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="120" y1="145" x2="730" y2="145" stroke="#111" stroke-width="1" stroke-dasharray="6 5"/>
<text x="102" y="430" class="small">0</text>
<text x="72" y="151" class="small">gT</text>
<text x="530" y="432" class="small">T − 1 s</text>
<text x="723" y="432" class="small">T</text>
<text x="660" y="118" class="strong">首次触地</text>
<text x="786" y="229" class="title">?</text>
<text x="770" y="265" class="small">之后需给出</text>
<text x="770" y="293" class="small">碰撞后信息</text>
<text x="457" y="490" class="strong">阴影：h(T) − h(T − 1 s)</text>
<line x1="640" y1="453" x2="640" y2="365" stroke="#111" stroke-width="1" marker-end="url(#arrow)"/>
<text x="25" y="546" class="small">这一秒的起点速度已不为 0；不要把它误当从静止开始的第一秒。</text>
<text x="25" y="583" class="small">模型前提：v₀ = 0，忽略空气阻力，g 恒定，向下为正；到 T 处停止外推。</text>
</svg>