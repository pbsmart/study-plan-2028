<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="555" viewBox="0 0 1000 555" role="img" aria-labelledby="title desc"><title id="title">从两个条件取交，保留内部缺点</title><desc id="desc">教学函数为根号x加二除以x减一。第一条条件x大于等于负二；第二条排除一；共同允许范围是负二含到一不含，再接一不含到正无穷。负二实心，一空心，最右箭头代表继续增大。</desc><rect width="1000" height="555" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="#111"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:20px}.title{font-size:27px;font-weight:700}.small{font-size:18px}.strong{font-weight:700}</style>
<text x="25" y="43" class="title">f(x) = √(x + 2) / (x − 1)</text>
<text x="25" y="80" class="small">图中每行刻度相同；实心表示可取，空心表示排除。右箭头表示继续延伸。</text>
<text x="25" y="168" class="strong">根式：x ≥ −2</text>
