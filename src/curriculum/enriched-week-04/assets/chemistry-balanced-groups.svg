<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="785" viewBox="0 0 1080 785" role="img" aria-labelledby="title desc"><title id="title">系数改份数，下标保留物质身份</title><desc id="desc">纸面计量示意：2份H₂加1份O₂对应2份H₂O，箭头左侧与右侧H总数均4、O总数均2。只改变化学式前的系数，不改变H₂O的下标。</desc><rect width="1080" height="785" fill="#fff"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#111"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:24px}.title{font-size:32px;font-weight:700}.small{font-size:21px}.tiny{font-size:19px}.strong{font-weight:700}.white{fill:#fff}.formula{font-size:30px}.rule{stroke:#111;stroke-width:2;fill:none}.arrow{stroke:#111;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style>
<text x="30" y="48" class="title">系数改份数，下标保留物质身份</text>
<text x="30" y="87" class="small">系数＝取几份；下标＝每份的组成。没写系数或下标时，按 1 计数。</text>
<rect x="30" y="118" width="260" height="301" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="365" y="118" width="260" height="301" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="730" y="118" width="320" height="301" rx="12" fill="#f7f7f7" stroke="#111" stroke-width="2"/>
<rect x="90" y="143" width="44" height="46" rx="5" fill="#111"/><text x="112" y="177" text-anchor="middle" class="formula strong white">2</text><text x="145" y="177" class="formula strong">H₂</text>
<rect x="430" y="143" width="44" height="46" rx="5" fill="#111"/><text x="452" y="177" text-anchor="middle" class="formula strong white">1</text><text x="485" y="177" class="formula strong">O₂</text>
<rect x="810" y="143" width="44" height="46" rx="5" fill="#111"/><text x="832" y="177" text-anchor="middle" class="formula strong white">2</text><text x="865" y="177" class="formula strong">H₂O</text>
<text x="160" y="219" text-anchor="middle">2 份 H₂</text><text x="495" y="219" text-anchor="middle">1 份 O₂</text><text x="890" y="219" text-anchor="middle">2 份 H₂O</text>
<text x="327" y="288" text-anchor="middle" font-size="38">＋</text><path d="M653,278 H702" class="arrow"/>
<rect x="45" y="242" width="108" height="123" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="167" y="242" width="108" height="123" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="397" y="242" width="196" height="123" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="744" y="242" width="139" height="123" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
<rect x="898" y="242" width="139" height="123" rx="8" fill="#fff" stroke="#111" stroke-width="2"/>
<circle cx="74" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="74" y="294" text-anchor="middle" class="strong">H</text><circle cx="124" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="124" y="294" text-anchor="middle" class="strong">H</text><circle cx="196" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="196" y="294" text-anchor="middle" class="strong">H</text><circle cx="246" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="246" y="294" text-anchor="middle" class="strong">H</text><circle cx="465" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="465" y="294" text-anchor="middle" class="strong">O</text><circle cx="525" cy="286" r="20" fill="#fff" stroke="#111" stroke-width="2"/><text x="525" y="294" text-anchor="middle" class="strong">O</text><circle cx="771" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="771" y="294" text-anchor="middle" class="strong">H</text><circle cx="814" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="814" y="294" text-anchor="middle" class="strong">O</text><circle cx="857" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="857" y="294" text-anchor="middle" class="strong">H</text><circle cx="925" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="925" y="294" text-anchor="middle" class="strong">H</text><circle cx="968" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="968" y="294" text-anchor="middle" class="strong">O</text><circle cx="1011" cy="286" r="18" fill="#fff" stroke="#111" stroke-width="2"/><text x="1011" y="294" text-anchor="middle" class="strong">H</text><text x="99" y="342" text-anchor="middle" class="small">H₂</text><text x="221" y="342" text-anchor="middle" class="small">H₂</text><text x="495" y="342" text-anchor="middle" class="small">O₂</text><text x="814" y="342" text-anchor="middle" class="small">H₂O</text><text x="968" y="342" text-anchor="middle" class="small">H₂O</text>
<text x="160" y="397" text-anchor="middle" class="tiny">每份含 2 个 H</text><text x="495" y="397" text-anchor="middle" class="tiny">每份含 2 个 O</text><text x="890" y="397" text-anchor="middle" class="tiny">每份含 2 个 H、1 个 O</text>
<text x="30" y="461" class="strong">逐元素核对：系数 × 下标；同侧有多处时相加</text>
<rect x="30" y="480" width="1020" height="184" rx="10" fill="#fff" stroke="#111" stroke-width="2"/>
<path d="M30,529 H1050 M30,596 H1050 M218,480 V664 M634,480 V664" class="rule"/>
<text x="124" y="513" text-anchor="middle" class="small strong">原子</text><text x="426" y="513" text-anchor="middle" class="small strong">左侧</text><text x="842" y="513" text-anchor="middle" class="small strong">右侧</text>
<text x="124" y="575" text-anchor="middle" class="formula strong">H</text><text x="426" y="575" text-anchor="middle" class="formula">2 × 2 ＝ 4</text><text x="842" y="575" text-anchor="middle" class="formula">2 × 2 ＝ 4</text>
<text x="124" y="642" text-anchor="middle" class="formula strong">O</text><text x="426" y="642" text-anchor="middle" class="formula">1 × 2 ＝ 2</text><text x="842" y="642" text-anchor="middle" class="formula">2 × 1 ＝ 2</text>
<text x="30" y="707" class="strong">守恒核对：H：4＝4；O：2＝2。</text>
<text x="30" y="750" class="small">仅作纸面计量，不是实验；卡片不表示真实碰撞或反应机理。</text></svg>
