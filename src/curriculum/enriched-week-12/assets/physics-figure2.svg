<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">答案图：拉动—撤力—停止，一张v-t图核对总账</title><desc id="desc">例1速度图节点(0秒,0)、(3秒,6米每秒)、(6秒,0)，之后到8秒恒0。前后两个三角形面积各9米，总位移与路程18米。撤力不使速度跳变，停后不倒滑。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：拉动—撤力—停止，一张v-t图核对总账</text><text x="35" y="85" font-size="22" fill="#17253d" font-weight="normal">例1：前3 s拉动；3 s撤力；6 s停后保持静止</text><line x1="90" y1="335" x2="910" y2="335" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="390" x2="90" y2="105" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="335" x2="390" y2="125" stroke="#2563eb" stroke-width="3"/><line x1="390" y1="125" x2="690" y2="335" stroke="#d97706" stroke-width="3"/><line x1="690" y1="335" x2="890" y2="335" stroke="#0f766e" stroke-width="3"/><line x1="390" y1="125" x2="390" y2="335" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="63" y="132" font-size="20" fill="#17253d" font-weight="normal">6</text><text x="380" y="368" font-size="20" fill="#17253d" font-weight="normal">3</text><text x="681" y="368" font-size="20" fill="#17253d" font-weight="normal">6</text><text x="882" y="368" font-size="20" fill="#17253d" font-weight="normal">8</text><text x="910" y="368" font-size="20" fill="#17253d" font-weight="normal">t/s</text><text x="100" y="112" font-size="20" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="195" y="288" font-size="23" fill="#17253d" font-weight="normal">9 m</text><text x="485" y="288" font-size="23" fill="#17253d" font-weight="normal">9 m</text><text x="720" y="310" font-size="19" fill="#17253d" font-weight="normal">静止：新增位移0</text><text x="35" y="420" font-size="21" fill="#17253d" font-weight="normal">两个三角形面积9 + 9 = 18 m；全程不反向，路程也为18 m。</text><text x="35" y="467" font-size="21" fill="#17253d" font-weight="normal">撤力节点v连续；停止节点之后不再延长原滑动摩擦加速度。</text></g></svg>