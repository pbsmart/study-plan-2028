<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">连续反应：把上一段终点交给下一段</title><desc id="desc">三卡依次为第一段氧化、第二段沉淀、最后质量与浓度。第一段先算Fe²⁺初量与限制者，得到剩Fe²⁺和生成Fe³⁺；第二段在Cl₂与酸均无剩余、隔绝空气且无其他耗碱反应的题定模型中，分别按二价耗2份OH⁻、三价耗3份OH⁻；最后各沉淀分别算质量，余OH⁻除最终液相体积。图中无任何累计题数值答案。</desc><rect width="1000" height="430" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183047"><text x="40" y="54" font-size="28" font-weight="700">连续反应：把上一段终点交给下一段</text><text x="40" y="91" font-size="18">纸面概念图；条件先行，不表示实验步骤</text><rect x="40" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="58" y="160" font-size="22" font-weight="700">第一段：氧化</text><text x="58" y="202" font-size="20">cV得到初始mol</text><text x="58" y="240" font-size="20">先判限制者</text><text x="58" y="278" font-size="20">输出两种铁的真实量</text><line x1="329" y1="240" x2="351" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="356,240 347,233 347,247" fill="#44657e"/><rect x="360" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="378" y="160" font-size="22" font-weight="700">第二段：沉淀</text><text x="378" y="202" font-size="20">只接上一段终点</text><text x="378" y="240" font-size="20">Fe²⁺配2份OH⁻</text><text x="378" y="278" font-size="20">Fe³⁺配3份OH⁻</text><line x1="649" y1="240" x2="671" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="676,240 667,233 667,247" fill="#44657e"/><rect x="680" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="698" y="160" font-size="22" font-weight="700">最后：所求与检查</text><text x="698" y="202" font-size="20">不同沉淀分别算质量</text><text x="698" y="240" font-size="20">余OH⁻ / 最终液相V</text><text x="698" y="278" font-size="20">核Fe、原子、电荷</text><text x="40" y="398" font-size="19">先说明为何用此模型，再查物质、原子、电荷与实际反应量。</text></g></svg>