<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="550" viewBox="0 0 1000 550" role="img" aria-labelledby="title desc"><title id="title">答案图：从视重读数反推速度，两次转向分开计路程</title><desc id="desc">累计4向上为正，速度折线为(0秒,正1)、(2秒,负1)、(4秒,负1)、(6秒,正1)，在1秒与5秒变号转向。三段位移0、负2、0米，三段路程1、2、1米，总位移向下2米而路程4米。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="550" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：从视重读数反推速度，两次转向分开计路程</text><text x="35" y="86" font-size="22" fill="#17253d" font-weight="normal">累计4：由读数450 / 500 / 550 N得a = −1 / 0 / +1 m/s²</text><polygon points="90,250 90,150 220,250" fill="#dcfce7"/><polygon points="220,250 350,350 350,250" fill="#ffedd5"/><polygon points="350,250 350,350 610,350 610,250" fill="#ffedd5"/><polygon points="610,250 610,350 740,250" fill="#ffedd5"/><polygon points="740,250 870,150 870,250" fill="#dcfce7"/><line x1="90" y1="250" x2="925" y2="250" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="395" x2="90" y2="112" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="150" x2="350" y2="350" stroke="#2563eb" stroke-width="3"/><line x1="350" y1="350" x2="610" y2="350" stroke="#2563eb" stroke-width="3"/><line x1="610" y1="350" x2="870" y2="150" stroke="#2563eb" stroke-width="3"/><line x1="220" y1="245" x2="220" y2="255" stroke="#64748b" stroke-width="3"/><text x="213" y="282" font-size="19" fill="#17253d" font-weight="normal">1</text><line x1="350" y1="245" x2="350" y2="255" stroke="#64748b" stroke-width="3"/><text x="343" y="282" font-size="19" fill="#17253d" font-weight="normal">2</text><line x1="610" y1="245" x2="610" y2="255" stroke="#64748b" stroke-width="3"/><text x="603" y="282" font-size="19" fill="#17253d" font-weight="normal">4</text><line x1="740" y1="245" x2="740" y2="255" stroke="#64748b" stroke-width="3"/><text x="733" y="282" font-size="19" fill="#17253d" font-weight="normal">5</text><line x1="870" y1="245" x2="870" y2="255" stroke="#64748b" stroke-width="3"/><text x="863" y="282" font-size="19" fill="#17253d" font-weight="normal">6</text><line x1="350" y1="250" x2="350" y2="350" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="610" y1="250" x2="610" y2="350" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="48" y="156" font-size="20" fill="#17253d" font-weight="normal">+1</text><text x="47" y="357" font-size="20" fill="#17253d" font-weight="normal">−1</text><text x="61" y="257" font-size="19" fill="#17253d" font-weight="normal">0</text><text x="103" y="117" font-size="20" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="927" y="280" font-size="20" fill="#17253d" font-weight="normal">t/s</text><text x="200" y="195" font-size="20" fill="#0f766e" font-weight="normal">1 s转向</text><text x="705" y="195" font-size="20" fill="#0f766e" font-weight="normal">5 s转向</text><text x="385" y="333" font-size="21" fill="#17253d" font-weight="normal">一直向下：位移−2 m</text><text x="114" y="425" font-size="20" fill="#17253d" font-weight="normal">0—2 s：位移0，路程1 m</text><text x="382" y="425" font-size="20" fill="#17253d" font-weight="normal">2—4 s：位移−2 m</text><text x="685" y="425" font-size="20" fill="#17253d" font-weight="normal">4—6 s：位移0</text><text x="35" y="478" font-size="23" fill="#17253d" font-weight="normal">总位移：0 − 2 + 0 = −2 m（向下2 m）</text><text x="35" y="523" font-size="22" fill="#17253d" font-weight="normal">总路程：1 + 2 + 1 = 4 m；速度零点两侧确实变号，才算转向。</text></g></svg>