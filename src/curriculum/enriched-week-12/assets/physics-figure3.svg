<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">答案图：断绳只解除约束，不抹去原速度</title><desc id="desc">例3速度图两者共同从(0秒,0)到(2秒,4米每秒)；断绳后A到(3秒,7)，B到(3秒,4)。A后段a3，B为0；3秒累计位移A9.5米、B8米。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：断绳只解除约束，不抹去原速度</text><text x="35" y="85" font-size="22" fill="#17253d" font-weight="normal">例3：2 s断绳，无额外冲量；A继续受6 N向右力</text><line x1="90" y1="390" x2="865" y2="390" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="435" x2="90" y2="102" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="390" x2="510" y2="230" stroke="#2563eb" stroke-width="3"/><line x1="510" y1="230" x2="720" y2="110" stroke="#d97706" stroke-width="3"/><line x1="510" y1="230" x2="720" y2="230" stroke="#0f766e" stroke-width="3"/><line x1="510" y1="230" x2="510" y2="390" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="60" y="238" font-size="20" fill="#17253d" font-weight="normal">4</text><text x="60" y="117" font-size="20" fill="#17253d" font-weight="normal">7</text><text x="503" y="422" font-size="20" fill="#17253d" font-weight="normal">2</text><text x="713" y="422" font-size="20" fill="#17253d" font-weight="normal">3</text><text x="855" y="422" font-size="20" fill="#17253d" font-weight="normal">t/s</text><text x="102" y="112" font-size="20" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="740" y="125" font-size="20" fill="#b45309" font-weight="normal">A：a=3 m/s²</text><text x="740" y="240" font-size="20" fill="#0f766e" font-weight="normal">B：a=0</text><text x="260" y="199" font-size="20" fill="#17253d" font-weight="normal">共同段 a=2 m/s²</text><text x="540" y="332" font-size="19" fill="#17253d" font-weight="normal">断绳时两者v都仍为4</text><text x="35" y="476" font-size="21" fill="#17253d" font-weight="normal">3 s：A位移9.5 m、B位移8 m；都要加上断绳前各自已走的4 m。</text></g></svg>