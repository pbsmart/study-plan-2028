<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">第9—12周累计路线：条件→受力→运动→核验</title><desc id="desc">四张复习卡依次为9周合力与a、10周阶段边界、11周视重与连接、12周连续初值与互查。必要回查旧工具；唯一20分累计替代普通周测，不展示测验数值答案。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">第9—12周累计路线：条件→受力→运动→核验</text><rect x="30" y="75" width="465" height="140" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="50" y="110" font-size="23" fill="#17253d" font-weight="bold">第9周：合力与a</text><text x="50" y="151" font-size="21" fill="#17253d" font-weight="normal">同一对象，真实外力</text><text x="50" y="188" font-size="20" fill="#17253d" font-weight="normal">ΣF = ma，不用单个拉力</text><rect x="520" y="75" width="465" height="140" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="540" y="110" font-size="23" fill="#17253d" font-weight="bold">第10周：阶段边界</text><text x="540" y="151" font-size="21" fill="#17253d" font-weight="normal">停止、转向、接触变化</text><text x="540" y="188" font-size="20" fill="#17253d" font-weight="normal">先查条件，再决定旧式能否继续</text><rect x="30" y="235" width="465" height="140" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="50" y="270" font-size="23" fill="#17253d" font-weight="bold">第11周：视重与连接</text><text x="50" y="311" font-size="21" fill="#17253d" font-weight="normal">a方向决定视重</text><text x="50" y="348" font-size="20" fill="#17253d" font-weight="normal">绳绷紧才用连接约束</text><rect x="520" y="235" width="465" height="140" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="540" y="270" font-size="23" fill="#17253d" font-weight="bold">第12周：接续并核验</text><text x="540" y="311" font-size="21" fill="#17253d" font-weight="normal">节点速度、各段历时</text><text x="540" y="348" font-size="20" fill="#17253d" font-weight="normal">图面积/另一个受力式交叉核对</text><text x="35" y="436" font-size="20" fill="#17253d" font-weight="normal">必要回查1—8周：单位/方向、恒定段、图像、摩擦、分量与平衡。</text><text x="35" y="478" font-size="22" fill="#17253d" font-weight="normal">唯一20分累计卷替代普通周测；同一评分点只算一次。</text></g></svg>