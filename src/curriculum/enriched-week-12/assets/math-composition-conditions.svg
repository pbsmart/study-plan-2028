<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="t d"><title id="t">复合表达式有两道门，化简后仍要守住原条件</title><desc id="d">第一道门是g(x)存在；第二道门是g(x)属于外层f的定义域。并列运算还要同时满足分母不为零、偶次根号内非负、对数真数正，以及题给范围。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="570" fill="white"/><text x="28" y="38" class="h">复合表达式有两道门，化简后仍要守住原条件</text><rect x="45" y="110" width="910" height="100" rx="8" class="box"/><text x="70" y="147">1  内层先存在</text><text x="70" y="187">检查g(x)的分母、根号等原始限制</text><text x="500" y="236" text-anchor="middle">↓</text><rect x="45" y="245" width="910" height="100" rx="8" class="box"/><text x="70" y="282">2  内层输出送给外层</text><text x="70" y="322">f(u)的条件作用在u=g(x)这个整体上</text><text x="500" y="371" text-anchor="middle">↓</text><rect x="45" y="380" width="910" height="100" rx="8" class="box"/><text x="70" y="417">3  与题给范围取交</text><text x="70" y="457">原条件不因合并、约分或解出候选根而消失</text><text x="40" y="530" class="s">分母≠0    偶次根号内≥0    对数真数&gt;0：三个符号各有理由。</text></svg>