<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">水平面斜力：先算N，再算摩擦</title><desc id="desc">两卡比较斜上拉N等于mg减Fsinθ与斜下压N等于mg加Fsinθ；条件为角从水平量起且保持接触。上拉算出负N应否定接触假设。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">水平面斜力：先算N，再算摩擦</text><rect x="30" y="75" width="465" height="305" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="55" y="118" font-size="25" fill="#17253d" font-weight="bold">斜向上拉</text><text x="55" y="175" font-size="25" fill="#17253d" font-weight="normal">N = mg − F sinθ</text><text x="55" y="230" font-size="23" fill="#17253d" font-weight="normal">fₖ = μₖN，通常减小</text><text x="55" y="285" font-size="21" fill="#17253d" font-weight="normal">必须检验 N ≥ 0</text><text x="55" y="340" font-size="20" fill="#17253d" font-weight="normal">已滑动才用μₖ，停后重查静摩擦</text><rect x="520" y="75" width="465" height="305" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="545" y="118" font-size="25" fill="#17253d" font-weight="bold">斜向下压</text><text x="545" y="175" font-size="25" fill="#17253d" font-weight="normal">N = mg + F sinθ</text><text x="545" y="230" font-size="23" fill="#17253d" font-weight="normal">fₖ = μₖN，通常增大</text><text x="545" y="285" font-size="21" fill="#17253d" font-weight="normal">竖直a = 0来自接触约束</text><text x="545" y="340" font-size="20" fill="#17253d" font-weight="normal">已滑动才用μₖ，停后重查静摩擦</text><text x="35" y="428" font-size="21" fill="#17253d" font-weight="normal">条件：水平面、角从水平量起、保持接触且竖直a=0。</text><text x="35" y="469" font-size="21" fill="#17253d" font-weight="normal">若上拉使计算N&lt;0：原接触假设失败；脱离后N=0，摩擦=0。</text></g></svg>