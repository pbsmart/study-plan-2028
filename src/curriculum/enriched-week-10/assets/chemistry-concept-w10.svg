<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">同一Cl₂，电子账看产物去向</title><desc id="desc">三卡依次表示先读条件、再分辨Cl去向、最后计算电子。氯水用可逆符号⇌；冷稀碱中Cl分别变−1与+1，每mol实际Cl₂转移1 mol电子；若Cl₂全还原成Cl⁻，每mol接受2 mol电子。</desc><rect width="1000" height="430" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183047"><text x="40" y="54" font-size="28" font-weight="700">同一Cl₂，电子账看产物去向</text><text x="40" y="91" font-size="18">纸面概念图；条件先行，不表示实验步骤</text><rect x="40" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="58" y="160" font-size="22" font-weight="700">先读条件</text><text x="58" y="202" font-size="20">氯水：用 ⇌</text><text x="58" y="240" font-size="20">冷、稀碱：定产物</text><text x="58" y="278" font-size="20">完全反应：另需题给</text><line x1="329" y1="240" x2="351" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="356,240 347,233 347,247" fill="#44657e"/><rect x="360" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="378" y="160" font-size="22" font-weight="700">再看Cl去向</text><text x="378" y="202" font-size="20">歧化：0→−1及+1</text><text x="378" y="240" font-size="20">全还原：0→−1</text><text x="378" y="278" font-size="20">相同元素≠相同物质</text><line x1="649" y1="240" x2="671" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="676,240 667,233 667,247" fill="#44657e"/><rect x="680" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="698" y="160" font-size="22" font-weight="700">最后记电子</text><text x="698" y="202" font-size="20">歧化：每mol转移1mol</text><text x="698" y="240" font-size="20">全还原：每mol得2mol</text><text x="698" y="278" font-size="20">得与失不相加</text><text x="40" y="398" font-size="19">先说明为何用此模型，再查物质、原子、电荷与实际反应量。</text></g></svg>