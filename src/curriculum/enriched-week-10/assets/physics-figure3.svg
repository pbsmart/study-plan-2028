<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">答案图：粗糙上滑—停止—下滑</title><desc id="desc">例3上坡为正，v-t点依次(0秒,4米每秒)、(0.5秒,0)、(1.5秒,负4米每秒)。上滑a负8，停点静摩擦所需6牛超过4牛，开始下滑后a负4。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：粗糙上滑—停止—下滑</text><text x="35" y="85" font-size="22" fill="#17253d" font-weight="bold">例3：上坡取正；0.5 s停止后不能直接延用a</text><line x1="90" y1="275" x2="570" y2="275" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="440" x2="90" y2="115" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="90" y1="135" x2="240" y2="275" stroke="#2563eb" stroke-width="3"/><line x1="240" y1="275" x2="540" y2="415" stroke="#d97706" stroke-width="3"/><text x="58" y="142" font-size="19" fill="#17253d" font-weight="normal">4</text><text x="48" y="420" font-size="19" fill="#17253d" font-weight="normal">−4</text><text x="221" y="305" font-size="19" fill="#17253d" font-weight="normal">0.5</text><text x="523" y="305" font-size="19" fill="#17253d" font-weight="normal">1.5</text><text x="554" y="310" font-size="19" fill="#17253d" font-weight="normal">t/s</text><text x="100" y="118" font-size="19" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="125" y="185" font-size="20" fill="#17253d" font-weight="normal">a = −8 m/s²</text><text x="313" y="380" font-size="20" fill="#17253d" font-weight="normal">a = −4 m/s²</text><rect x="610" y="110" width="350" height="285" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="632" y="150" font-size="24" fill="#17253d" font-weight="bold">停点重判</text><text x="632" y="195" font-size="20" fill="#17253d" font-weight="normal">静摩擦需要6 N向上坡</text><text x="632" y="235" font-size="20" fill="#17253d" font-weight="normal">但上限4 N，不足</text><text x="632" y="275" font-size="20" fill="#17253d" font-weight="normal">于是下滑，摩擦改向上坡</text><text x="632" y="315" font-size="20" fill="#17253d" font-weight="normal">新a为4 m/s²向下坡</text><text x="632" y="360" font-size="20" fill="#17253d" font-weight="normal">不是旧a继续走</text><text x="35" y="477" font-size="20" fill="#17253d" font-weight="normal">坐标点：(0,4)、(0.5,0)、(1.5,−4)。后段1 s从停止点重新计时。</text></g></svg>