<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" role="img" aria-labelledby="t d"><title id="t">三个图提醒：触轴、缺口和跳跃各有不同结论</title><desc id="d">左图y=(x−1)²在[0,2]端点都正，但零点1存在。中图1/x跨0处无定义，端点异号不能保证有零点。右图x&lt;0时−1、x≥0时1，在0有跳跃，每处有定义但无零点。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="640" fill="white"/><text x="28" y="38" class="h">三个图提醒：触轴、缺口和跳跃各有不同结论</text><text x="25" y="80" class="s">同号不能排除零点；异号的存在结论必须有整段连续前提。</text><path d="M55.0 416.2L300.0 416.2" class="axis"/><path d="M55.0 480.0L55.0 170.0" class="axis"/><text x="290.0" y="447.2" class="s">x</text><text x="63.0" y="160.0" class="s">y</text><path d="M55.0 413.2L55.0 419.2" class="axis"/><text x="55.0" y="437.2" class="s" text-anchor="middle">0</text><path d="M166.4 413.2L166.4 419.2" class="axis"/><text x="166.4" y="437.2" class="s" text-anchor="middle">1</text><path d="M277.7 413.2L277.7 419.2" class="axis"/><text x="277.7" y="437.2" class="s" text-anchor="middle">2</text><path d="M52.0 233.8L58.0 233.8" class="axis"/><text x="47.0" y="238.8" class="s" text-anchor="end">1</text><text x="175" y="130" text-anchor="middle">(x−1)²</text><path d="M55 233.8L60.1 250L65.1 265.5L70.2 280.2L75.2 294.1L80.3 307.3L85.4 319.7L90.4 331.4L95.5 342.3L100.6 352.5L105.6 361.9L110.7 370.6L115.7 378.5L120.8 385.7L125.9 392.1L130.9 397.7L136 402.6L141.1 406.8L146.1 410.1L151.2 412.8L156.2 414.7L161.3 415.8L166.4 416.2L171.4 415.8L176.5 414.7L181.5 412.8L186.6 410.1L191.7 406.8L196.7 402.6L201.8 397.7L206.9 392.1L211.9 385.7L217 378.5L222 370.6L227.1 361.9L232.2 352.5L237.2 342.3L242.3 331.4L247.4 319.7L252.4 307.3L257.5 294.1L262.5 280.2L267.6 265.5L272.7 250L277.7 233.8" class="curve"/><circle cx="166.4" cy="416.2" r=