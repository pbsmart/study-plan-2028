<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">沿坡与法向分开，不能把整个mg塞进沿坡式</title><desc id="desc">左图斜面向右升高，G竖直下；沿坡分量向左下、法向分量向右下，二者平行四边形合成G。右图列保持接触法向平衡与下滑沿坡方程。θ是斜面与水平的夹角。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">沿坡与法向分开，不能把整个mg塞进沿坡式</text><rect x="30" y="75" width="430" height="340" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><rect x="480" y="75" width="490" height="340" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="55" y="110" font-size="22" fill="#17253d" font-weight="bold">斜面坐标：重力仍竖直向下</text><line x1="80" y1="357.5" x2="410" y2="110" stroke="#94a3b8" stroke-width="3"/><line x1="250" y1="230" x2="250" y2="330" stroke="#17253d" stroke-width="3" marker-end="url(#a)"/><line x1="250" y1="230" x2="202" y2="266" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><line x1="250" y1="230" x2="298" y2="294" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/><line x1="202" y1="266" x2="250" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><line x1="298" y1="294" x2="250" y2="330" stroke="#94a3b8" stroke-width="3" stroke-dasharray="6 5"/><text x="260" y="347" font-size="22" fill="#17253d" font-weight="normal">G</text><text x="65" y="285" font-size="19" fill="#b45309" font-weight="normal">G sinθ 下坡</text><text x="300" y="290" font-size="19" fill="#0f766e" font-weight="normal">G cosθ</text><text x="300" y="317" font-size="19" fill="#0f766e" font-weight="normal">向坡内</text><text x="75" y="389" font-size="18" fill="#17253d" font-weight="normal">虚线构成分量相加平行四边形</text><text x="505" y="120" font-size="23" fill="#17253d" font-weight="bold">保持平直斜面接触时</text><text x="505" y="170" font-size="23" fill="#17253d" font-weight="normal">法向：N − mg cosθ = 0</text><text x="505" y="220" font-size="23" fill="#17253d" font-weight="normal">下滑：mg sinθ − μₖN = ma</text><text x="505" y="270" font-size="23" fill="#17253d" font-weight="normal">上滑：摩擦也指向下坡</text><text x="505" y="320" font-size="21" fill="#17253d" font-weight="normal">先定上/下坡正方向，再填符号</text><text x="505" y="370" font-size="21" fill="#17253d" font-weight="normal">分量不增加实际力的数量</text><text x="35" y="466" font-size="20" fill="#17253d" font-weight="normal">左图只作重力分解；未额外画支持力、摩擦。θ为斜面与水平的夹角。</text></g></svg>