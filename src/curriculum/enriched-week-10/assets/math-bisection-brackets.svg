<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">二分保留的是仍然异号的一半</title><desc id="d">教学例f(x)=2^x+x−4：初始[1,2]端值−1、2；中点1.5函数值约0.3284正，保留[1,1.5]；新中点1.25函数值约−0.3716负，保留[1.25,1.5]。只定位范围，不宣布中点为准确根。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="610" fill="white"/><text x="28" y="38" class="h">二分保留的是仍然异号的一半</text><text x="30" y="80" class="s">教学例：f(x)=2^x+x−4；已分别证明连续存在与严格递增唯一。</text><path d="M100 160L820 160" class="axis"/><path d="M100 160L820 160" class="curve"/><circle cx="100" cy="160" r="4" fill="#2167b2"/><circle cx="820" cy="160" r="4" fill="#2167b2"/><text x="100" y="145" text-anchor="middle">−</text><text x="820" y="145" text-anchor="middle">+</text><text x="100" y="185" class="s" text-anchor="middle">1</text><text x="820" y="185" class="s" text-anchor="middle">2</text><text x="105" y="225" class="s">初始：f(1)=−1，f(2)=2</text><path d="M100 295L820 295" class="axis"/><path d="M100 295L460.0 295" class="curve"/><circle cx="100" cy="295" r="4" fill="#2167b2"/><circle cx="460.0" cy="295" r="4" fill="#2167b2"/><text x="100" y="280" text-anchor="middle">−</text><text x="460.0" y="280" text-anchor="middle">+</text><text x="100" y="320" class="s" text-anchor="middle">1</text><text x="460.0" y="320" class="s" text-anchor="middle">1.5</text><text x="105" y="360" class="s">第1次：f(1.5)≈0.3284&gt;0</text><path d="M100 430L820 430" class="axis"/><path d="M280.0 430L460.0 430" class="curve"/><circle cx="280.0" cy="430" r="4" fill="#2167b2"/><circle cx="460.0" cy="430" r="4" fill="#2167b2"/><text x="280.0" y="415" text-anchor="middle">−</text><text x="460.0" y="415" text-anchor="middle">+</text><text x="280.0" y="455" class="s" text-anchor="middle">1.25</text><text x="460.0" y="455" class="s" text-anchor="middle">1.5</text><text x="105" y="495" class="s">第2次：f(1.25)≈−0.3716&lt;0</text><text x="35" y="575">最终宽度1/4；两端都不是根，根在(1.25,1.5)内。</text></svg>