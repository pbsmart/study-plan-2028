<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w8-physics-fig3-title w8-physics-fig3-desc"><title id="w8-physics-fig3-title">静摩擦方向跟着“相对滑动趋势”变</title><desc id="w8-physics-fig3-desc">三张独立示意卡：F&lt;A、F=A、F&gt;A；静摩擦分别向上坡、0、向下坡；共同需满足|F−A|≤f最大。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">静摩擦方向跟着“相对滑动趋势”变</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">三个独立假设。A向下坡、F向上坡；方向示意，箭长不按比例。</text><rect x="43" y="145" width="355" height="370" rx="12" fill="white" stroke="#D9E1EA"/><text x="221" y="195" font-size="30" fill="#2167B2" text-anchor="middle" font-weight="700">F &lt; A</text><line x1="91" y1="310" x2="353" y2="310" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><text x="343" y="346" font-size="18" fill="#718397" text-anchor="end">上坡为正</text><circle cx="217" cy="310" r="5" fill="#20334A"/><line x1="217" y1="310" x2="113" y2="310" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><text x="125" y="285" font-size="18" fill="#D27627" text-anchor="start">A向下坡</text><line x1="217" y1="380" x2="297" y2="380" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="309" y="408" font-size="18" fill="#2167B2" text-anchor="end">F向上坡</text><line x1="183" y1="230" x2="283" y2="230" stroke="#237C66" stroke-width="3" marker-end="url(#green)"/><text x="221" y="475" font-size="20" fill="#237C66" text-anchor="middle">f &gt; 0：摩擦向上坡</text><rect x="433" y="145" width="355" height="370" rx="12" fill="white" stroke="#D9E1EA"/><text x="611" y="195" font-size="30" fill="#2167B2" text-anchor="middle" font-weight="700">F = A</text><line x1="481" y1="310" x2="743" y2="310" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><text x="733" y="346" font-size="18" fill="#718397" text-anchor="end">上坡为正</text><circle cx="607" cy="310" r="5" fill="#20334A"/><line x1="607" y1="310" x2="503" y2="310" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><text x="515" y="285" font-size="18" fill="#D27627" text-anchor="start">A向下坡</text><line x1="607" y1="380" x2="711" y2="380" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="699" y="408" font-size="18" fill="#2167B2" text-anchor="end">F向上坡</text><text x="611" y="247" font-size="27" fill="#237C66" text-anchor="middle">0</text><text x="611" y="475" font-size="20" fill="#237C66" text-anchor="middle">f = 0：无需摩擦</text><rect x="823" y="145" width="355" height="370" rx="12" fill="white" stroke="#D9E1EA"/><text x="1001" y="195" font-size="30" fill="#2167B2" text-anchor="middle" font-weight="700">F &gt; A</text><line x1="871" y1="310" x2="1133" y2="310" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><text x="1123" y="346" font-size="18" fill="#718397" text-anchor="end">上坡为正</text><circle cx="997" cy="310" r="5" fill="#20334A"/><line x1="997" y1="310" x2="893" y2="310" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><text x="905" y="285" font-size="18" fill="#D27627" text-anchor="start">A向下坡</text><line x1="997" y1="380" x2="1141" y2="380" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="1089" y="408" font-size="18" fill="#2167B2" text-anchor="end">F向上坡</text><line x1="1063" y1="230" x2="963" y2="230" stroke="#237C66" stroke-width="3" marker-end="url(#green)"/><text x="1001" y="475" font-size="20" fill="#237C66" text-anchor="middle">f &lt; 0：摩擦向下坡</text><text x="54" y="568" font-size="23" fill="#20334A" text-anchor="start">上坡正：F + f − A = 0，所以 f = A − F。</text><text x="54" y="615" font-size="21" fill="#2167B2" text-anchor="start">还必须满足 |F − A| ≤ f最大；按题设理想模型，等号可为临界静止。</text></g></svg>
