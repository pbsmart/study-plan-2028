<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">同底比较前，先看底数在哪个范围</title><desc id="d">对a&gt;1的递增指数函数，a^u&gt;a^v等价u&gt;v；对0&lt;a&lt;1的递减函数，a^u&gt;a^v等价u&lt;v。比较方向变化来自单调性，不是移项；等号按原题保留。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="600" fill="white"/><text x="28" y="38" class="h">同底比较前，先看底数在哪个范围</text><rect x="45" y="130" width="430" height="330" rx="8" class="box"/><rect x="525" y="130" width="430" height="330" rx="8" class="box"/><text x="260" y="185" text-anchor="middle">a&gt;1：递增</text><text x="740" y="185" text-anchor="middle">0&lt;a&lt;1：递减</text><text x="260" y="255" text-anchor="middle">a^u &gt; a^v</text><text x="740" y="255" text-anchor="middle">a^u &gt; a^v</text><text x="260" y="315" text-anchor="middle">等价于 u&gt;v</text><text x="740" y="315" text-anchor="middle">等价于 u&lt;v</text><text x="260" y="405" class="s" text-anchor="middle">输出次序与输入相同</text><text x="740" y="405" class="s" text-anchor="middle">输出次序与输入相反</text><text x="55" y="535">先把两边改为同底数幂，再比较指数，最后解一次不等式。</text></svg>