<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="w8-chem-3-title w8-chem-3-desc"><title id="w8-chem-3-title">把第5—8周接成一条可检查的路线</title><desc id="w8-chem-3-desc">第5周先统一n、c、V和单位；第6周检查强弱、溶解性和状态；第7周求价及每份电子量；第8周配电子比、补H/O、消电子并查原子电荷电子。计量必须用实际反应量。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">把第5—8周接成一条可检查的路线</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">累计诊断只是一套20分；四类技能一起用，评分点不重复计算。</text><rect x="42" y="121" width="1116" height="99" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="165" font-size="25" fill="#2167B2" text-anchor="start" font-weight="700">第5周</text><text x="260" y="161" font-size="27" fill="#20334A" text-anchor="start" font-weight="700">量与单位</text><text x="260" y="199" font-size="24" fill="#20334A" text-anchor="start">n = cV；mL → L；V 是最终溶液体积。</text><line x1="600" y1="227" x2="600" y2="244" stroke="#2167B2" stroke-width="2" marker-end="url(#blue)"/><rect x="42" y="251" width="1116" height="99" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="295" font-size="25" fill="#2167B2" text-anchor="start" font-weight="700">第6周</text><text x="260" y="291" font-size="27" fill="#20334A" text-anchor="start" font-weight="700">存在形式</text><text x="260" y="329" font-size="24" fill="#20334A" text-anchor="start">先查强弱、溶解性、状态；弱酸与水保留。</text><line x1="600" y1="357" x2="600" y2="374" stroke="#2167B2" stroke-width="2" marker-end="url(#blue)"/><rect x="42" y="381" width="1116" height="99" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="425" font-size="25" fill="#2167B2" text-anchor="start" font-weight="700">第7周</text><text x="260" y="421" font-size="27" fill="#20334A" text-anchor="start" font-weight="700">变价与电子</text><text x="260" y="459" font-size="24" fill="#20334A" text-anchor="start">先求价，再求每份电子；得失是同一批。</text><line x1="600" y1="487" x2="600" y2="504" stroke="#2167B2" stroke-width="2" marker-end="url(#blue)"/><rect x="42" y="511" width="1116" height="99" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="555" font-size="25" fill="#2167B2" text-anchor="start" font-weight="700">第8周</text><text x="260" y="551" font-size="27" fill="#20334A" text-anchor="start" font-weight="700">配平与计量</text><text x="260" y="589" font-size="24" fill="#20334A" text-anchor="start">电子比 → 补H/O → 消电子 → 三账检查。</text><rect x="42" y="660" width="1116" height="54" rx="10" fill="#FFF3E5" stroke="#D9E1EA"/><text x="600" y="696" font-size="23" fill="#20334A" text-anchor="middle" font-weight="700">返回量的计算：质量先除 M；使用实际反应量；剩余 n 再除最终 V。</text></g></svg>