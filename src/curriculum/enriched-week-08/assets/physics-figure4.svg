<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w8-physics-fig4-title w8-physics-fig4-desc"><title id="w8-physics-fig4-title">第5—8周：一份累计诊断，四条检查线</title><desc id="w8-physics-fig4-desc">四个卡片分别是第5周图像正负面积，第6周摩擦实际值/上限，第7周角度基准与分量，第8周两方向平衡与静止范围。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">第5—8周：一份累计诊断，四条检查线</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">这张图只是复习路线，没有新增题目或分数；同一评分点只计一次。</text><rect x="36" y="158" width="268" height="315" rx="12" fill="white" stroke="#D9E1EA"/><text x="170" y="208" font-size="21" fill="#2167B2" text-anchor="middle" font-weight="700">第5周：运动图像</text><text x="170" y="285" font-size="19" fill="#20334A" text-anchor="middle">先读轴与单位</text><text x="170" y="341" font-size="19" fill="#20334A" text-anchor="middle">斜率、速度变号</text><text x="170" y="397" font-size="19" fill="#20334A" text-anchor="middle">正负面积与路程</text><line x1="307" y1="314" x2="325" y2="314" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><rect x="328" y="158" width="268" height="315" rx="12" fill="white" stroke="#D9E1EA"/><text x="462" y="208" font-size="21" fill="#D27627" text-anchor="middle" font-weight="700">第6周：力与摩擦</text><text x="462" y="285" font-size="19" fill="#20334A" text-anchor="middle">圈定受力对象</text><text x="462" y="341" font-size="19" fill="#20334A" text-anchor="middle">先看接触与状态</text><text x="462" y="397" font-size="19" fill="#20334A" text-anchor="middle">实际值、上限、滑动</text><line x1="599" y1="314" x2="617" y2="314" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><rect x="620" y="158" width="268" height="315" rx="12" fill="white" stroke="#D9E1EA"/><text x="754" y="208" font-size="21" fill="#237C66" text-anchor="middle" font-weight="700">第7周：方向分量</text><text x="754" y="285" font-size="19" fill="#20334A" text-anchor="middle">先圈角度起算线</text><text x="754" y="341" font-size="19" fill="#20334A" text-anchor="middle">邻边cos，对边sin</text><text x="754" y="397" font-size="19" fill="#20334A" text-anchor="middle">同轴带符号相加</text><line x1="891" y1="314" x2="909" y2="314" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><rect x="912" y="158" width="268" height="315" rx="12" fill="white" stroke="#D9E1EA"/><text x="1046" y="208" font-size="21" fill="#2167B2" text-anchor="middle" font-weight="700">第8周：平衡检验</text><text x="1046" y="285" font-size="19" fill="#20334A" text-anchor="middle">两方向分别平衡</text><text x="1046" y="341" font-size="19" fill="#20334A" text-anchor="middle">检查支持力与上限</text><text x="1046" y="397" font-size="19" fill="#20334A" text-anchor="middle">范围、零值与反向</text><rect x="43" y="507" width="1114" height="96" rx="10" fill="#E8EEF5" stroke="#D9E1EA"/><text x="62" y="545" font-size="21" fill="#20334A" text-anchor="start">必要旧知识：第1周单位/正方向；第2周变化率；第3周分段模型；</text><text x="62" y="581" font-size="21" fill="#20334A" text-anchor="start">第4周触地边界。不会的点回本周补救，不另叠一张复习卷。</text></g></svg>
