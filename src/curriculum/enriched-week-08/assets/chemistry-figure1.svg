<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="w8-chem-1-title w8-chem-1-desc"><title id="w8-chem-1-title">酸性半反应：每次只补一类缺口</title><desc id="w8-chem-1-desc">酸性MnO₄⁻到Mn²⁺半反应依次右补4水平氧，左补8H⁺平氢，左补5电子使电荷由+7降到+2。最终MnO₄⁻+8H⁺+5e⁻→Mn²⁺+4H₂O。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">酸性半反应：每次只补一类缺口</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">题给 MnO₄⁻ → Mn²⁺；物质身份已确定，不能为配平改下标或电荷。</text><rect x="42" y="120" width="1116" height="121" rx="12" fill="white" stroke="#D9E1EA"/><text x="75" y="176" font-size="38" fill="#2167B2" text-anchor="start" font-weight="700">1</text><text x="151" y="163" font-size="26" fill="#20334A" text-anchor="start" font-weight="700">右补 4H₂O：先让 O 两边各 4</text><text x="151" y="209" font-size="26" fill="#2167B2" text-anchor="start">MnO₄⁻ → Mn²⁺ + 4H₂O</text><line x1="600" y1="249" x2="600" y2="265" stroke="#2167B2" stroke-width="2" marker-end="url(#blue)"/><rect x="42" y="274" width="1116" height="121" rx="12" fill="white" stroke="#D9E1EA"/><text x="75" y="330" font-size="38" fill="#2167B2" text-anchor="start" font-weight="700">2</text><text x="151" y="317" font-size="26" fill="#20334A" text-anchor="start" font-weight="700">左补 8H⁺：再让 H 两边各 8</text><text x="151" y="363" font-size="26" fill="#2167B2" text-anchor="start">MnO₄⁻ + 8H⁺ → Mn²⁺ + 4H₂O</text><line x1="600" y1="403" x2="600" y2="419" stroke="#2167B2" stroke-width="2" marker-end="url(#blue)"/><rect x="42" y="428" width="1116" height="121" rx="12" fill="white" stroke="#D9E1EA"/><text x="75" y="484" font-size="38" fill="#2167B2" text-anchor="start" font-weight="700">3</text><text x="151" y="471" font-size="26" fill="#20334A" text-anchor="start" font-weight="700">左补 5e⁻：电荷从 +7 降到 +2</text><text x="151" y="517" font-size="26" fill="#2167B2" text-anchor="start">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O</text><rect x="42" y="590" width="1116" height="67" rx="12" fill="#FFF3E5" stroke="#D9E1EA"/><text x="600" y="634" font-size="23" fill="#20334A" text-anchor="middle" font-weight="700">独立复核：Mn 从 +7 降到 +2，确实得 5e⁻；半式电子留待合并消去。</text></g></svg>