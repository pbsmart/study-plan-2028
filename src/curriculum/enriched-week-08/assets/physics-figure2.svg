<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w8-physics-fig2-title w8-physics-fig2-desc"><title id="w8-physics-fig2-title">斜拉箱子：先求支持力，再查摩擦上限</title><desc id="w8-physics-fig2-desc">水平地面箱子右上斜拉F，相对水平角θ；旁边依次写N=mg−Fsinθ，f需=Fcosθ，检验f需≤μ_sN。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">斜拉箱子：先求支持力，再查摩擦上限</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">前提：假设静止、保持接触。细虚线只辅助分解，不额外计力。</text><line x1="67" y1="393" x2="580" y2="393" stroke="#718397" stroke-width="2.5"/><rect x="260" y="289" width="100" height="103" rx="0" fill="#E8EEF5" stroke="#D9E1EA"/><circle cx="310" cy="340" r="4" fill="#20334A"/><line x1="310" y1="340" x2="310" y2="260" stroke="#2167B2" stroke-width="2.5" marker-end="url(#blue)"/><text x="327" y="277" font-size="24" fill="#2167B2" text-anchor="start">N</text><line x1="310" y1="340" x2="310" y2="566" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><text x="327" y="547" font-size="23" fill="#D27627" text-anchor="start">mg</text><line x1="310" y1="340" x2="505" y2="194" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="455" y="220" font-size="24" fill="#2167B2" text-anchor="start">F</text><line x1="310" y1="340" x2="115" y2="340" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><text x="115" y="318" font-size="22" fill="#D27627" text-anchor="start">f_s</text><line x1="310" y1="340" x2="505" y2="340" stroke="#718397" stroke-width="1.6" stroke-dasharray="7 5"/><line x1="505" y1="340" x2="505" y2="194" stroke="#718397" stroke-width="1.6" stroke-dasharray="7 5"/><path d="M370 340 A60 60 0 0 0 358 304" stroke="#237C66" stroke-width="2" fill="none"/><text x="389" y="324" font-size="23" fill="#237C66" text-anchor="start">θ</text><rect x="690" y="150" width="440" height="116" rx="10" fill="white" stroke="#D9E1EA"/><text x="712" y="186" font-size="22" fill="#2167B2" text-anchor="start" font-weight="700">1. 竖直平衡</text><text x="712" y="234" font-size="24" fill="#20334A" text-anchor="start">N = mg − Fsinθ</text><rect x="690" y="288" width="440" height="116" rx="10" fill="white" stroke="#D9E1EA"/><text x="712" y="324" font-size="22" fill="#2167B2" text-anchor="start" font-weight="700">2. 水平所需</text><text x="712" y="372" font-size="24" fill="#20334A" text-anchor="start">f需 = Fcosθ</text><rect x="690" y="426" width="440" height="116" rx="10" fill="white" stroke="#D9E1EA"/><text x="712" y="462" font-size="22" fill="#2167B2" text-anchor="start" font-weight="700">3. 与允许上限比较</text><text x="712" y="510" font-size="24" fill="#20334A" text-anchor="start">f需 ≤ μ_sN 且 N ≥ 0</text><text x="57" y="619" font-size="20" fill="#20334A" text-anchor="start">超限就否定静止假设；题给已经滑动，才改用f_k = μ_kN。</text></g></svg>
