<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690" role="img" aria-labelledby="w8-chem-2-title w8-chem-2-desc"><title id="w8-chem-2-title">整条放大，电子相消，再查三本账</title><desc id="w8-chem-2-desc">Mn半反应需5电子，Fe半反应整条乘5；相加消去5e⁻后，总式为MnO₄⁻+5Fe²⁺+8H⁺→Mn²⁺+5Fe³⁺+4H₂O。原子Mn1Fe5O4H8，电荷两侧+17，失得电子各5份。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">整条放大，电子相消，再查三本账</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">乘倍数时每一项都乘；最终总式不保留 e⁻。</text><rect x="42" y="126" width="1116" height="88" rx="12" fill="white" stroke="#D9E1EA"/><text x="600" y="181" font-size="29" fill="#2167B2" text-anchor="middle" font-weight="700">MnO₄⁻ + 8H⁺ + 5e⁻ → Mn²⁺ + 4H₂O</text><rect x="42" y="246" width="1116" height="88" rx="12" fill="white" stroke="#D9E1EA"/><text x="600" y="301" font-size="27" fill="#237C66" text-anchor="middle" font-weight="700">5 ×（Fe²⁺ → Fe³⁺ + e⁻）＝ 5Fe²⁺ → 5Fe³⁺ + 5e⁻</text><line x1="600" y1="351" x2="600" y2="390" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="630" y="380" font-size="23" fill="#20334A" text-anchor="start">两边相加，约去同一批 5e⁻</text><rect x="42" y="407" width="1116" height="88" rx="12" fill="#E8F2FF" stroke="#D9E1EA"/><text x="600" y="462" font-size="29" fill="#2167B2" text-anchor="middle" font-weight="700">MnO₄⁻ + 5Fe²⁺ + 8H⁺ → Mn²⁺ + 5Fe³⁺ + 4H₂O</text><rect x="42" y="532" width="358" height="111" rx="10" fill="white" stroke="#D9E1EA"/><text x="221" y="572" font-size="26" fill="#20334A" text-anchor="middle" font-weight="700">原子账</text><text x="221" y="613" font-size="22" fill="#20334A" text-anchor="middle">Mn1 / Fe5 / O4 / H8</text><rect x="421" y="532" width="358" height="111" rx="10" fill="white" stroke="#D9E1EA"/><text x="600" y="572" font-size="26" fill="#20334A" text-anchor="middle" font-weight="700">电荷账</text><text x="600" y="613" font-size="22" fill="#20334A" text-anchor="middle">两侧均为 +17</text><rect x="800" y="532" width="358" height="111" rx="10" fill="white" stroke="#D9E1EA"/><text x="979" y="572" font-size="26" fill="#20334A" text-anchor="middle" font-weight="700">电子账</text><text x="979" y="613" font-size="22" fill="#20334A" text-anchor="middle">失 5 = 得 5；只计 5</text></g></svg>