<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w8-physics-fig1-title w8-physics-fig1-desc"><title id="w8-physics-fig1-title">平衡不是没有力，也不是一瞬间v=0</title><desc id="w8-physics-fig1-desc">左侧匀速水平箱子水平拉力与摩擦相反相等，竖直N与G相反相等；右侧刚释放小球v=0且只受向下重力。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">平衡不是没有力，也不是一瞬间v=0</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">左边持续匀速，可以列合力0；右边刚释放的小球随后会变速。</text><rect x="75" y="135" width="470" height="410" rx="14" fill="white" stroke="#D9E1EA"/><rect x="655" y="135" width="470" height="410" rx="14" fill="white" stroke="#D9E1EA"/><text x="310" y="182" font-size="24" fill="#2167B2" text-anchor="middle">匀速直线运动的箱子</text><line x1="112" y1="424" x2="508" y2="424" stroke="#718397" stroke-width="2"/><rect x="260" y="347" width="100" height="75" rx="0" fill="#E8EEF5" stroke="#D9E1EA"/><circle cx="310" cy="385" r="4" fill="#20334A"/><line x1="310" y1="385" x2="310" y2="245" stroke="#2167B2" stroke-width="2.5" marker-end="url(#blue)"/><text x="331" y="261" font-size="22" fill="#2167B2" text-anchor="start">N</text><line x1="310" y1="385" x2="310" y2="525" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><text x="331" y="493" font-size="22" fill="#D27627" text-anchor="start">G</text><line x1="310" y1="385" x2="465" y2="385" stroke="#2167B2" stroke-width="2.5" marker-end="url(#blue)"/><text x="448" y="365" font-size="22" fill="#2167B2" text-anchor="start">F</text><line x1="310" y1="385" x2="155" y2="385" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><text x="157" y="365" font-size="22" fill="#D27627" text-anchor="start">f</text><text x="890" y="182" font-size="24" fill="#D27627" text-anchor="middle">刚释放：瞬时v=0</text><circle cx="890" cy="295" r="16" fill="#2167B2"/><line x1="890" y1="314" x2="890" y2="472" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><text x="917" y="407" font-size="24" fill="#D27627" text-anchor="start">G</text><text x="890" y="510" font-size="19" fill="#D27627" text-anchor="middle">只受重力，不能列整体平衡</text><text x="55" y="606" font-size="22" fill="#20334A" text-anchor="start">平衡的依据是持续静止或匀速；力可以非零而相互抵消。</text></g></svg>
