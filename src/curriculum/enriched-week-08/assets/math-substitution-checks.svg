<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="t d"><title id="t">换元后有三层条件，不能只解一个二次式</title><desc id="d">流程：令t=a^x并写t&gt;0；解代数方程或不等式；与t&gt;0筛选；按底数增减还原x；最后与原输入范围取交。同一条件可能跨周，但评分不能重复。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="630" fill="white"/><text x="28" y="38" class="h">换元后有三层条件，不能只解一个二次式</text><rect x="95" y="80" width="810" height="75" rx="8" class="box"/><text x="120" y="110">1  给指数输出取名</text><text x="480" y="128" class="s">t=a^x，必须同时写t&gt;0</text><text x="500" y="175" text-anchor="middle">↓</text><rect x="95" y="180" width="810" height="75" rx="8" class="box"/><text x="120" y="210">2  解关于t的代数式</text><text x="480" y="228" class="s">用零乘积或根的符号表</text><text x="500" y="275" text-anchor="middle">↓</text><rect x="95" y="280" width="810" height="75" rx="8" class="box"/><text x="120" y="310">3  筛选指数输出</text><text x="480" y="328" class="s">只留下符合t&gt;0的部分</text><text x="500" y="375" text-anchor="middle">↓</text><rect x="95" y="380" width="810" height="75" rx="8" class="box"/><text x="120" y="410">4  还原为原输入x</text><text x="480" y="428" class="s">看底数增减，不能把t直接当x</text><text x="500" y="475" text-anchor="middle">↓</text><rect x="95" y="480" width="810" height="75" rx="8" class="box"/><text x="120" y="510">5  回到原题</text><text x="480" y="528" class="s">再与题给x的允许范围取交</text><text x="35" y="610" class="s">累计诊断只做本周35分钟这一次；订正按第一处条件遗漏回查。</text></svg>