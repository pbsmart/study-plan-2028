<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">合并不能把原来无定义的输入补回来</title><desc id="d">原式log₂(x−1)+log₂(x−3)要求x&gt;3。合并后乘积(x−1)(x−3)&gt;0还包含x&lt;1，但该支两个原真数都负，不能加入原定义域。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="600" fill="white"/><text x="28" y="38" class="h">合并不能把原来无定义的输入补回来</text><text x="30" y="80" class="s">教学对照：log₂(x−1)+log₂(x−3) 与 log₂[(x−1)(x−3)]</text><rect x="40" y="115" width="920" height="120" rx="8" class="box"/><text x="70" y="155">原式：x−1&gt;0 且 x−3&gt;0</text><text x="70" y="200">两个条件同时成立 ⇒ x&gt;3</text><rect x="40" y="270" width="920" height="120" rx="8" class="box"/><text x="70" y="310">只看乘积：(x−1)(x−3)&gt;0</text><text x="70" y="355">得到x&lt;1或x&gt;3，但x&lt;1不能回填给原式</text><rect x="40" y="425" width="920" height="110" rx="8" class="box"/><text x="70" y="466">例如x=0：原真数−1、−3都非法，乘积却是3。</text><text x="70" y="510">合并法则的前提是两个原真数分别正。</text></svg>