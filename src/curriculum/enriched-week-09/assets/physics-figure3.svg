<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">答案图：同样到v=0，两种后续模型</title><desc id="desc">左例4速度折线点为(0秒,6米每秒)、(1.5秒,0)、(2秒,负2米每秒)，位移4米路程5米；右例5从(0秒,3)到(1.2秒,0)，此后到3秒保持0，位移路程均1.8米。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：同样到v=0，两种后续模型</text><text x="40" y="85" font-size="22" fill="#17253d" font-weight="bold">例4：恒力持续，速度跨零</text><text x="535" y="85" font-size="22" fill="#17253d" font-weight="bold">例5：只有摩擦，停后静止</text><line x1="80" y1="300" x2="430" y2="300" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="80" y1="365" x2="80" y2="125" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="80" y1="144" x2="380" y2="352" stroke="#2563eb" stroke-width="3"/><line x1="305" y1="300" x2="305" y2="320" stroke="#64748b" stroke-width="3"/><text x="53" y="140" font-size="18" fill="#17253d" font-weight="normal">6</text><text x="43" y="356" font-size="18" fill="#17253d" font-weight="normal">−2</text><text x="294" y="342" font-size="18" fill="#17253d" font-weight="normal">1.5</text><text x="374" y="326" font-size="18" fill="#17253d" font-weight="normal">2</text><text x="412" y="330" font-size="18" fill="#17253d" font-weight="normal">t/s</text><text x="92" y="126" font-size="18" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="85" y="390" font-size="18" fill="#17253d" font-weight="normal">(0,6) → (1.5,0) → (2,−2)</text><text x="85" y="425" font-size="21" fill="#17253d" font-weight="normal">位移4 m；路程5 m</text><line x1="590" y1="300" x2="935" y2="300" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="590" y1="350" x2="590" y2="130" stroke="#64748b" stroke-width="3" marker-end="url(#a)"/><line x1="590" y1="180" x2="710" y2="300" stroke="#2563eb" stroke-width="3"/><line x1="710" y1="300" x2="890" y2="300" stroke="#0f766e" stroke-width="3"/><text x="563" y="185" font-size="18" fill="#17253d" font-weight="normal">3</text><text x="698" y="329" font-size="18" fill="#17253d" font-weight="normal">1.2</text><text x="882" y="329" font-size="18" fill="#17253d" font-weight="normal">3</text><text x="928" y="330" font-size="18" fill="#17253d" font-weight="normal">t/s</text><text x="600" y="131" font-size="18" fill="#17253d" font-weight="normal">v/(m/s)</text><text x="595" y="390" font-size="18" fill="#17253d" font-weight="normal">(0,3) → (1.2,0) → (3,0)</text><text x="595" y="425" font-size="21" fill="#17253d" font-weight="normal">位移与路程均1.8 m</text><text x="35" y="474" font-size="20" fill="#17253d" font-weight="normal">答案图：纵轴是速度；两图刻度不同，不能直接比屏幕上的斜率大小。</text></g></svg>