<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">先写“谁对谁”，再决定两力是哪一对</title><desc id="desc">左A所受B力向左，B所受A力向右，两箭头等长；右同一个静止书受等长向上N和向下G。两幅图不共用力比例尺。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">先写“谁对谁”，再决定两力是哪一对</text><rect x="30" y="75" width="565" height="340" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><rect x="615" y="75" width="355" height="340" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="55" y="110" font-size="23" fill="#17253d" font-weight="bold">相互作用力：分属两个对象</text><text x="638" y="110" font-size="23" fill="#17253d" font-weight="bold">平衡力：同一对象</text><circle cx="200" cy="230" r="24" fill="#dbeafe"/><circle cx="430" cy="230" r="24" fill="#ffedd5"/><text x="191" y="238" font-size="21" fill="#17253d" font-weight="normal">A</text><text x="422" y="238" font-size="21" fill="#17253d" font-weight="normal">B</text><line x1="200" y1="230" x2="100" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="430" y1="230" x2="530" y2="230" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="55" y="185" font-size="20" fill="#17253d" font-weight="normal">B对A</text><text x="435" y="185" font-size="20" fill="#17253d" font-weight="normal">A对B</text><text x="55" y="300" font-size="21" fill="#17253d" font-weight="normal">等大、反向、同种相互作用</text><text x="55" y="355" font-size="21" fill="#17253d" font-weight="normal">不能在A一个对象的方程里抵消</text><circle cx="790" cy="245" r="16" fill="#dbeafe"/><line x1="790" y1="245" x2="790" y2="155" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="790" y1="245" x2="790" y2="335" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="815" y="175" font-size="22" fill="#17253d" font-weight="normal">N</text><text x="815" y="325" font-size="22" fill="#17253d" font-weight="normal">G</text><text x="640" y="382" font-size="21" fill="#17253d" font-weight="normal">书静止时：N = G</text><text x="35" y="465" font-size="21" fill="#17253d" font-weight="normal">力对的等大反向画成等长箭头；两幅图不共用力的比例尺。</text></g></svg>