<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">三个箭头不要混：v、a与合力</title><desc id="desc">三卡分别为v右a右的加速、v右a左的减速、v为0但a左；合力均与a同向。箭长仅表示方向，不跨量比较大小。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">三个箭头不要混：v、a与合力</text><rect x="30" y="75" width="305" height="300" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="50" y="110" font-size="24" fill="#17253d" font-weight="bold">向右加速</text><text x="52" y="170" font-size="23" fill="#0f766e" font-weight="normal">v</text><line x1="110" y1="163" x2="255" y2="163" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/><text x="52" y="225" font-size="23" fill="#17253d" font-weight="normal">a</text><line x1="110" y1="218" x2="255" y2="218" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="50" y="280" font-size="19" fill="#17253d" font-weight="normal">v与a同向：速率增大</text><text x="50" y="330" font-size="19" fill="#17253d" font-weight="normal">合力方向与a一致</text><rect x="355" y="75" width="305" height="300" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="375" y="110" font-size="24" fill="#17253d" font-weight="bold">向右减速</text><text x="377" y="170" font-size="23" fill="#0f766e" font-weight="normal">v</text><line x1="435" y1="163" x2="580" y2="163" stroke="#0f766e" stroke-width="3" marker-end="url(#a)"/><text x="377" y="225" font-size="23" fill="#17253d" font-weight="normal">a</text><line x1="580" y1="218" x2="435" y2="218" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="375" y="280" font-size="19" fill="#17253d" font-weight="normal">v与a反向：速率减小</text><text x="375" y="330" font-size="19" fill="#17253d" font-weight="normal">合力方向与a一致</text><rect x="680" y="75" width="305" height="300" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="700" y="110" font-size="24" fill="#17253d" font-weight="bold">瞬时停下</text><text x="760" y="170" font-size="23" fill="#0f766e" font-weight="normal">v = 0</text><text x="702" y="225" font-size="23" fill="#17253d" font-weight="normal">a</text><line x1="905" y1="218" x2="760" y2="218" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="700" y="280" font-size="19" fill="#17253d" font-weight="normal">v=0仍可能a≠0</text><text x="700" y="330" font-size="19" fill="#17253d" font-weight="normal">合力方向与a一致</text><text x="35" y="420" font-size="21" fill="#17253d" font-weight="normal">只比较方向；v、a单位不同，箭头长度不作数值比较。</text><text x="35" y="462" font-size="21" fill="#17253d" font-weight="normal">停下后是否反向，必须重新检查真实受力。</text></g></svg>