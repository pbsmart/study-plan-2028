<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="590" viewBox="0 0 1000 590" role="img" aria-labelledby="t d"><title id="t">每次解题保留三个对象</title><desc id="d">原条件栏包括合法底数、每个原真数正与题给x区间。变形栏处理等价方程或依底数单调比较。最终栏取交并代回原式，负x不自动删、真数0必排除。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="590" fill="white"/><text x="28" y="38" class="h">每次解题保留三个对象</text><rect x="55" y="105" width="890" height="105" rx="8" class="box"/><text x="80" y="140">1  原条件</text><text x="80" y="182" class="s">每个真数分别&gt;0；底数&gt;0且≠1；题给x范围</text><text x="500" y="238" text-anchor="middle">↓</text><rect x="55" y="245" width="890" height="105" rx="8" class="box"/><text x="80" y="280">2  合法变形</text><text x="80" y="322" class="s">定义还原指数；乘除/幂法则；按底数增减比较</text><text x="500" y="378" text-anchor="middle">↓</text><rect x="55" y="385" width="890" height="105" rx="8" class="box"/><text x="80" y="420">3  筛选并核验</text><text x="80" y="462" class="s">代数结果与原条件取交；逐个端点、逐个原真数检查</text><text x="40" y="550">真数必须正 ≠ x必须正；对数值可以为负、零或正。</text></svg>