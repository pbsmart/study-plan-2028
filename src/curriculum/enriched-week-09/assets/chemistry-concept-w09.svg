<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">酸量分段：每份酸只记一次</title><desc id="desc">题定先全部转为碳酸氢根再放气的模型。设初始碳酸根a mol，累计H⁺为x mol。三卡依次为0≤x≤a、a&lt;x≤2a、x&gt;2a。第一段CO₂为0，第二段为x−a，第三段为a；过量段余H⁺为x−2a。</desc><rect width="1000" height="430" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183047"><text x="40" y="54" font-size="28" font-weight="700">酸量分段：每份酸只记一次</text><text x="40" y="91" font-size="18">纸面概念图；条件先行，不表示实验步骤</text><rect x="40" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="58" y="160" font-size="22" font-weight="700">第一段：0≤x≤a</text><text x="58" y="202" font-size="20">先成HCO₃⁻</text><text x="58" y="240" font-size="20">CO₂：0</text><text x="58" y="278" font-size="20">HCO₃⁻：x</text><line x1="329" y1="240" x2="351" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="356,240 347,233 347,247" fill="#44657e"/><rect x="360" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="378" y="160" font-size="22" font-weight="700">第二段：a&lt;x≤2a</text><text x="378" y="202" font-size="20">只用余酸 x−a</text><text x="378" y="240" font-size="20">CO₂：x−a</text><text x="378" y="278" font-size="20">HCO₃⁻：2a−x</text><line x1="649" y1="240" x2="671" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="676,240 667,233 667,247" fill="#44657e"/><rect x="680" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="698" y="160" font-size="22" font-weight="700">平台：x&gt;2a</text><text x="698" y="202" font-size="20">碳已经用尽</text><text x="698" y="240" font-size="20">CO₂：a</text><text x="698" y="278" font-size="20">余H⁺：x−2a</text><text x="40" y="398" font-size="19">先说明为何用此模型，再查物质、原子、电荷与实际反应量。</text></g></svg>