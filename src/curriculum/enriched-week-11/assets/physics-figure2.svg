<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">答案图：整体求a，隔离求T，再回代</title><desc id="desc">例3A质量2千克、B3千克，B受20牛向右，整体加速度4米每二次方秒。A受8牛向右张力；B受8牛向左张力与20牛向右外力。水平力箭长5像素每牛，张力40像素、外力100像素。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：整体求a，隔离求T，再回代</text><text x="35" y="85" font-size="22" fill="#17253d" font-weight="normal">例3：光滑水平面，A在左、B在右，轻绳绷紧</text><rect x="40" y="110" width="925" height="125" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><rect x="140" y="145" width="90" height="55" rx="12" fill="#dbeafe" stroke="#cbd5e1"/><rect x="470" y="145" width="90" height="55" rx="12" fill="#ffedd5" stroke="#cbd5e1"/><line x1="230" y1="172" x2="470" y2="172" stroke="#64748b" stroke-width="3"/><line x1="560" y1="172" x2="660" y2="172" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="150" y="179" font-size="19" fill="#17253d" font-weight="normal">A 2 kg</text><text x="480" y="179" font-size="19" fill="#17253d" font-weight="normal">B 3 kg</text><text x="680" y="180" font-size="22" fill="#17253d" font-weight="normal">F = 20 N</text><text x="60" y="215" font-size="21" fill="#17253d" font-weight="normal">整体：20 = (2+3)a → a = 4 m/s²</text><rect x="40" y="260" width="440" height="155" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><rect x="500" y="260" width="465" height="155" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="65" y="296" font-size="23" fill="#17253d" font-weight="bold">隔离A</text><text x="525" y="296" font-size="23" fill="#17253d" font-weight="bold">隔离B</text><circle cx="180" cy="335" r="12" fill="#bfdbfe"/><circle cx="680" cy="335" r="12" fill="#fed7aa"/><line x1="180" y1="335" x2="220" y2="335" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="680" y1="335" x2="640" y2="335" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><line x1="680" y1="335" x2="780" y2="335" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><text x="235" y="343" font-size="21" fill="#17253d" font-weight="normal">T = 8 N</text><text x="530" y="343" font-size="21" fill="#17253d" font-weight="normal">T = 8 N</text><text x="792" y="343" font-size="21" fill="#17253d" font-weight="normal">F = 20 N</text><text x="65" y="388" font-size="21" fill="#17253d" font-weight="normal">T = 2a = 8 N</text><text x="525" y="388" font-size="21" fill="#17253d" font-weight="normal">20 − 8 = 3 × 4</text><text x="35" y="462" font-size="20" fill="#17253d" font-weight="normal">只画水平力；全部力箭头采用5 px/N，T箭头40 px，F箭头100 px。</text></g></svg>