<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">ax + b = 0：除法前先检查 a</title><desc id="desc">本图限定a、b为实数，未知数x在实数域R。a非零时唯一解负b除以a。a等于0且b等于0时，所有实数均为解。a等于0且b不等于0时，无解。三分覆盖所有参数；若x另有限制范围D，非零分支还须筛选候选，恒等式的解集改为D。</desc><rect width="920" height="480" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="43" font-size="27" fill="#16324f" font-weight="bold">ax + b = 0：除法前先检查 a</text><text x="34" y="82" font-size="21" fill="#16324f" font-weight="normal">本图前提：a、b ∈ R，x ∈ R</text><rect x="34" y="110" width="264" height="226" rx="14" fill="#dbeafe"/><rect x="328" y="110" width="264" height="226" rx="14" fill="#ccfbf1"/><rect x="622" y="110" width="264" height="226" rx="14" fill="#fef3c7"/><text x="60" y="156" font-size="28" fill="#16324f" font-weight="bold">a ≠ 0</text><text x="60" y="206" font-size="22" fill="#16324f" font-weight="normal">可除以非零的 a</text><text x="60" y="249" font-size="28" fill="#16324f" font-weight="normal">x = −b/a</text><text x="60" y="299" font-size="20" fill="#16324f" font-weight="normal">有且只有一个实数解</text><text x="351" y="156" font-size="25" fill="#16324f" font-weight="bold">a = 0 且 b = 0</text><text x="351" y="206" font-size="22" fill="#16324f" font-weight="normal">原式成为 0 = 0</text><text x="351" y="249" font-size="28" fill="#16324f" font-weight="normal">解集：R</text><text x="351" y="299" font-size="20" fill="#16324f" font-weight="normal">无穷多个实数解</text><text x="644" y="156" font-size="25" fill="#16324f" font-weight="bold">a = 0 且 b ≠ 0</text><text x="644" y="206" font-size="22" fill="#16324f" font-weight="normal">原式成为 b = 0</text><text x="644" y="249" font-size="24" fill="#16324f" font-weight="normal">与 b ≠ 0 矛盾</text><text x="644" y="299" font-size="20" fill="#16324f" font-weight="normal">无实数解</text><text x="34" y="383" font-size="23" fill="#16324f" font-weight="bold">在 R 中，恰有一解 ⇔ a ≠ 0。三类互斥且完整。</text><text x="34" y="423" font-size="21" fill="#16324f" font-weight="normal">若另有限制 x ∈ D：唯一候选仍须在 D 中；恒等式的解集就是 D。</text><text x="34" y="458" font-size="20" fill="#16324f" font-weight="normal">D 是有限集时，“所有允许输入都是解”未必是无穷多解。</text></g></svg>
