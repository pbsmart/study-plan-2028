<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">包含关系把充分和必要放在正确方向</title><desc id="desc">在同一范围D内，P的真值集合A真包含于Q的真值集合B。A内的每个对象都在B中，所以P推出Q，P是Q的充分条件，Q是P的必要条件。B中A外的对象使Q真P假，阻止逆向推出。</desc><rect width="920" height="480" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="44" font-size="27" fill="#16324f" font-weight="bold">包含关系把充分和必要放在正确方向</text><rect x="34" y="75" width="450" height="310" rx="16" fill="#fff" stroke="#64748b" stroke-width="2"/><ellipse cx="261" cy="233" rx="185" ry="120" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/><ellipse cx="198" cy="233" rx="102" ry="74" fill="#ccfbf1" stroke="#0f766e" stroke-width="3"/><text x="49" y="102" font-size="18" fill="#16324f" font-weight="normal">共同允许范围 D</text><text x="325" y="195" font-size="20" fill="#16324f" font-weight="normal">B：Q成立</text><text x="133" y="219" font-size="20" fill="#16324f" font-weight="normal">A：P成立</text><text x="139" y="252" font-size="17" fill="#16324f" font-weight="normal">这里每个都在B</text><circle cx="370" cy="262" r="6" fill="#b45309"/><text x="329" y="292" font-size="17" fill="#92400e" font-weight="normal">Q真、P假</text><text x="525" y="121" font-size="28" fill="#16324f" font-weight="bold">A ⊆ B  ⇔  P ⇒ Q</text><text x="525" y="178" font-size="24" fill="#0f766e" font-weight="bold">P 是 Q 的充分条件</text><text x="525" y="221" font-size="24" fill="#1d4ed8" font-weight="bold">Q 是 P 的必要条件</text><text x="525" y="282" font-size="21" fill="#16324f" font-weight="normal">图中 A ≠ B：反向不成立</text><text x="525" y="320" font-size="22" fill="#16324f" font-weight="normal">所以 P 充分不必要</text><text x="525" y="355" font-size="22" fill="#16324f" font-weight="normal">换问法：Q 必要不充分</text><text x="34" y="432" font-size="22" fill="#16324f" font-weight="normal">若 A = B，两支箭头都成立，才是充要条件。先写箭头，再命名。</text></g></svg>
