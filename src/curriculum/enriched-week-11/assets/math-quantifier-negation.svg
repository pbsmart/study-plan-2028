<svg xmlns="http://www.w3.org/2000/svg" width="920" height="480" viewBox="0 0 920 480" role="img" aria-labelledby="title desc"><title id="title">量词否定的三格检查：范围不动</title><desc id="desc">全称命题“对所有x属于D，P(x)”的否定为“存在x属于同一D，使非P(x)”。存在命题的否定为同域全称且谓词取反。量词交换，范围保留，谓词取反。大于与小于等于互补，大于等于与小于互补，等于与不等于互补。</desc><rect width="920" height="480" fill="#f8fafc"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="34" y="44" font-size="27" fill="#16324f" font-weight="bold">量词否定的三格检查：范围不动</text><rect x="34" y="78" width="850" height="126" rx="14" fill="#dbeafe"/><rect x="34" y="224" width="850" height="126" rx="14" fill="#ccfbf1"/><text x="57" y="117" font-size="27" fill="#16324f" font-weight="normal">原句：∀ x ∈ D，P(x)</text><text x="57" y="171" font-size="27" fill="#16324f" font-weight="normal">否定：∃ x ∈ D，非 P(x)</text><text x="497" y="118" font-size="24" fill="#16324f" font-weight="normal">每一个都满足</text><text x="497" y="171" font-size="24" fill="#1d4ed8" font-weight="normal">只需至少一个不满足</text><text x="57" y="263" font-size="27" fill="#16324f" font-weight="normal">原句：∃ x ∈ D，P(x)</text><text x="57" y="317" font-size="27" fill="#16324f" font-weight="normal">否定：∀ x ∈ D，非 P(x)</text><text x="497" y="264" font-size="24" fill="#16324f" font-weight="normal">至少有一个满足</text><text x="497" y="317" font-size="24" fill="#0f766e" font-weight="normal">意味着每一个都不满足</text><text x="35" y="394" font-size="24" fill="#16324f" font-weight="bold">① 量词互换     ② D 原样保留     ③ 谓词准确取反</text><text x="35" y="440" font-size="22" fill="#16324f" font-weight="normal">互补对： &gt; 与 ≤； ≥ 与 &lt;； = 与 ≠。开闭端点也属于 D。</text></g></svg>
