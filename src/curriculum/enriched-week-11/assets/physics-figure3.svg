<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">答案图：两端等张力，a大小相同但方向相反</title><desc id="desc">例4两张隔离图，1千克物体受15牛上张力与10牛下重力；3千克受15牛上张力与30牛下重力，力箭均4像素每牛。共同加速度大小5米每二次方秒，轻物上、重物下。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="520" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">答案图：两端等张力，a大小相同但方向相反</text><text x="35" y="88" font-size="21" fill="#17253d" font-weight="normal">例4：轻绳跨固定光滑轻滑轮，绳绷紧；以下为两张隔离图</text><rect x="40" y="115" width="440" height="300" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><rect x="500" y="115" width="465" height="300" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="65" y="151" font-size="23" fill="#17253d" font-weight="bold">轻物体1 kg：向上正</text><text x="525" y="151" font-size="23" fill="#17253d" font-weight="bold">重物体3 kg：向下正</text><circle cx="210" cy="250" r="13" fill="#bfdbfe"/><circle cx="670" cy="250" r="13" fill="#fed7aa"/><line x1="210" y1="250" x2="210" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="210" y1="250" x2="210" y2="290" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><line x1="670" y1="250" x2="670" y2="190" stroke="#2563eb" stroke-width="3" marker-end="url(#a)"/><line x1="670" y1="250" x2="670" y2="370" stroke="#d97706" stroke-width="3" marker-end="url(#a)"/><text x="235" y="197" font-size="20" fill="#17253d" font-weight="normal">T = 15 N</text><text x="235" y="291" font-size="20" fill="#17253d" font-weight="normal">G = 10 N</text><text x="695" y="197" font-size="20" fill="#17253d" font-weight="normal">T = 15 N</text><text x="695" y="370" font-size="20" fill="#17253d" font-weight="normal">G = 30 N</text><text x="65" y="355" font-size="23" fill="#17253d" font-weight="normal">T − 10 = 1a</text><text x="65" y="394" font-size="22" fill="#17253d" font-weight="normal">a = 5 m/s² 向上</text><text x="525" y="394" font-size="22" fill="#17253d" font-weight="normal">30 − T = 3a；a向下</text><text x="35" y="457" font-size="21" fill="#17253d" font-weight="normal">同一力比例尺4 px/N；两端a只大小相同，方向相反。</text><text x="35" y="490" font-size="20" fill="#17253d" font-weight="normal">两侧T相等来自理想绳/滑轮条件，不是任意连接都能直接套。</text></g></svg>