<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="430" viewBox="0 0 1000 430" role="img" aria-labelledby="title desc"><title id="title">铁的转化：先写终价，再核条件</title><desc id="desc">三卡按读图顺序说明Fe单质0价在稀盐酸且无其他氧化剂时变Fe²⁺，每mol失2mol电子；Fe²⁺在题给Cl₂氧化下变Fe³⁺，每mol失1mol；Fe³⁺在题给Cu还原下变Fe²⁺，每mol得1mol。卡间箭头只表示阅读顺序，不是三步实物流程。</desc><rect width="1000" height="430" fill="#f7fafc"/><g font-family="Noto Sans CJK SC, sans-serif" fill="#183047"><text x="40" y="54" font-size="28" font-weight="700">铁的转化：先写终价，再核条件</text><text x="40" y="91" font-size="18">纸面概念图；条件先行，不表示实验步骤</text><rect x="40" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="58" y="160" font-size="22" font-weight="700">Fe：0价</text><text x="58" y="202" font-size="20">稀盐酸，无其他氧化剂</text><text x="58" y="240" font-size="20">Fe → Fe²⁺</text><text x="58" y="278" font-size="20">每mol Fe失2mol电子</text><line x1="329" y1="240" x2="351" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="356,240 347,233 347,247" fill="#44657e"/><rect x="360" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="378" y="160" font-size="22" font-weight="700">Fe²⁺：+2价</text><text x="378" y="202" font-size="20">题给Cl₂氧化</text><text x="378" y="240" font-size="20">Fe²⁺ → Fe³⁺</text><text x="378" y="278" font-size="20">每mol Fe²⁺失1mol</text><line x1="649" y1="240" x2="671" y2="240" stroke="#44657e" stroke-width="3"/><polygon points="676,240 667,233 667,247" fill="#44657e"/><rect x="680" y="122" width="280" height="232" rx="16" fill="#ffffff" stroke="#8aa6bb" stroke-width="2"/><text x="698" y="160" font-size="22" font-weight="700">Fe³⁺：+3价</text><text x="698" y="202" font-size="20">题给Cu还原</text><text x="698" y="240" font-size="20">Fe³⁺ → Fe²⁺</text><text x="698" y="278" font-size="20">每mol Fe³⁺得1mol</text><text x="40" y="398" font-size="19">先说明为何用此模型，再查物质、原子、电荷与实际反应量。</text></g></svg>