<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500" role="img" aria-labelledby="title desc"><title id="title">四种运动状态：超重、失重看a方向</title><desc id="desc">四卡为向上加速a上超重、向上减速a下失重、向下加速a下失重、向下减速a上超重。N大于mg为超重，小于mg为失重；mg保持不变。</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse"><polygon points="0,0 7,3 0,6" fill="context-stroke"/></marker></defs><rect width="1000" height="500" fill="#fff"/><g font-family="Noto Sans CJK SC, sans-serif"><text x="32" y="43" font-size="27" fill="#17253d" font-weight="bold">四种运动状态：超重、失重看a方向</text><rect x="30" y="73" width="465" height="145" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="50" y="108" font-size="23" fill="#17253d" font-weight="bold">向上加速</text><text x="50" y="148" font-size="21" fill="#17253d" font-weight="normal">v向上；a向上</text><text x="285" y="148" font-size="23" fill="#1d4ed8" font-weight="normal">超重</text><text x="50" y="190" font-size="24" fill="#17253d" font-weight="normal">N &gt; mg</text><rect x="520" y="73" width="465" height="145" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="540" y="108" font-size="23" fill="#17253d" font-weight="bold">向上减速</text><text x="540" y="148" font-size="21" fill="#17253d" font-weight="normal">v向上；a向下</text><text x="775" y="148" font-size="23" fill="#1d4ed8" font-weight="normal">失重</text><text x="540" y="190" font-size="24" fill="#17253d" font-weight="normal">N &lt; mg</text><rect x="30" y="238" width="465" height="145" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="50" y="273" font-size="23" fill="#17253d" font-weight="bold">向下加速</text><text x="50" y="313" font-size="21" fill="#17253d" font-weight="normal">v向下；a向下</text><text x="285" y="313" font-size="23" fill="#1d4ed8" font-weight="normal">失重</text><text x="50" y="355" font-size="24" fill="#17253d" font-weight="normal">N &lt; mg</text><rect x="520" y="238" width="465" height="145" rx="12" fill="#eef4fc" stroke="#cbd5e1"/><text x="540" y="273" font-size="23" fill="#17253d" font-weight="bold">向下减速</text><text x="540" y="313" font-size="21" fill="#17253d" font-weight="normal">v向下；a向上</text><text x="775" y="313" font-size="23" fill="#1d4ed8" font-weight="normal">超重</text><text x="540" y="355" font-size="24" fill="#17253d" font-weight="normal">N &gt; mg</text><text x="35" y="439" font-size="21" fill="#17253d" font-weight="normal">上为正：N − mg = ma。判断看a，单凭N不能决定v方向。</text><text x="35" y="477" font-size="21" fill="#17253d" font-weight="normal">本课g与质量不变，mg不变；视重改变的是N或测力计张力。</text></g></svg>