<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="862" viewBox="0 0 1200 862" role="img" aria-labelledby="title desc"><title id="title">混合先加溶质量，再除最终体积</title><desc id="desc">两份同溶质溶液分别以c₁V₁和c₂V₂求n，合并为n总；用题给最终溶液体积V终相除得到c终。仅当题目明确体积可加和时，V终才取V₁加V₂。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">混合先加溶质量，再除最终体积</text><text x="32" y="98" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">适用：同一种溶质，无反应、无挥发、无析出、无损失。</text><rect x="72" y="138" width="456" height="156" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><rect x="672" y="138" width="456" height="156" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="300" y="184" font-size="27" font-weight="700" fill="#162b3d" text-anchor="middle">第 1 份：c₁、V₁（L）</text><text x="300" y="247" font-size="32" font-weight="700" fill="#126b83" text-anchor="middle">n₁ = c₁V₁</text><text x="900" y="184" font-size="27" font-weight="700" fill="#162b3d" text-anchor="middle">第 2 份：c₂、V₂（L）</text><text x="900" y="247" font-size="32" font-weight="700" fill="#126b83" text-anchor="middle">n₂ = c₂V₂</text><path d="M300,310 L520,369" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><path d="M900,310 L680,369" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="346" y="385" width="508" height="110" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="600" y="453" font-size="32" font-weight="700" fill="#162b3d" text-anchor="middle">n总 = n₁ + n₂</text><path d="M600,510 L600,552" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><rect x="346" y="572" width="508" height="106" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><text x="600" y="641" font-size="32" font-weight="700" fill="#126b83" text-anchor="middle">c终 = n总 / V终</text><rect x="32" y="717" width="1136" height="106" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="57" y="757" font-size="24" font-weight="600" fill="#162b3d" text-anchor="start">V终：用题给或实测的最终溶液体积；明确“体积可加和”才用 V₁ + V₂。</text><text x="57" y="798" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">两浓度不能直接相加；只有等体积且可加和时，才可简单平均。</text></svg>