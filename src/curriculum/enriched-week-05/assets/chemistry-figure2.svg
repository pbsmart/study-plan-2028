<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="725" viewBox="0 0 1200 725" role="img" aria-labelledby="title desc"><title id="title">取样与稀释改变的是不同的量</title><desc id="desc">上排均一溶液分成大小两份，n与V同比例分开，两份c相同；下排同一份溶液只加水且无反应无溶质损失，n保持，最终V增大，c变小。示意点仅代表溶质计量份额，不代表真实NaCl分子。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">取样与稀释改变的是不同的量</text><text x="32" y="103" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">取样：从均一溶液分出一部分，n 与 V 按同一比例分开。</text><rect x="32" y="151" width="300" height="144" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><circle cx="70" cy="194" r="12" fill="#126b83"/><circle cx="70" cy="252" r="12" fill="#126b83"/><circle cx="144" cy="194" r="12" fill="#126b83"/><circle cx="144" cy="252" r="12" fill="#126b83"/><circle cx="218" cy="194" r="12" fill="#126b83"/><circle cx="218" cy="252" r="12" fill="#126b83"/><circle cx="292" cy="194" r="12" fill="#126b83"/><circle cx="292" cy="252" r="12" fill="#126b83"/><text x="182" y="137" font-size="25" font-weight="700" fill="#162b3d" text-anchor="middle">原来整份</text><path d="M350,222 L401,222" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><text x="482" y="137" font-size="25" font-weight="700" fill="#162b3d" text-anchor="middle">取出 1/4</text><rect x="445" y="151" width="75" height="144" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><circle cx="482" cy="194" r="12" fill="#126b83"/><circle cx="482" cy="252" r="12" fill="#126b83"/><text x="582" y="228" font-size="33" font-weight="700" fill="#162b3d" text-anchor="middle">＋</text><text x="754" y="137" font-size="25" font-weight="700" fill="#162b3d" text-anchor="middle">剩余 3/4</text><rect x="641" y="151" width="225" height="144" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><circle cx="678" cy="194" r="12" fill="#126b83"/><circle cx="678" cy="252" r="12" fill="#126b83"/><circle cx="752" cy="194" r="12" fill="#126b83"/><circle cx="752" cy="252" r="12" fill="#126b83"/><circle cx="826" cy="194" r="12" fill="#126b83"/><circle cx="826" cy="252" r="12" fill="#126b83"/><text x="970" y="197" font-size="23" font-weight="600" fill="#162b3d" text-anchor="middle">取出部分：c 不变</text><text x="970" y="246" font-size="23" font-weight="600" fill="#162b3d" text-anchor="middle">剩余部分：c 不变</text><text x="32" y="341" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">稀释：跟踪同一份溶质，只加水且无反应、无析出、无损失。</text><rect x="32" y="385" width="300" height="144" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><circle cx="70" cy="428" r="12" fill="#126b83"/><circle cx="70" cy="486" r="12" fill="#126b83"/><circle cx="144" cy="428" r="12" fill="#126b83"/><circle cx="144" cy="486" r="12" fill="#126b83"/><circle cx="218" cy="428" r="12" fill="#126b83"/><circle cx="218" cy="486" r="12" fill="#126b83"/><circle cx="292" cy="428" r="12" fill="#126b83"/><circle cx="292" cy="486" r="12" fill="#126b83"/><text x="182" y="572" font-size="25" font-weight="700" fill="#162b3d" text-anchor="middle">原来这份：n、V</text><path d="M348,457 L447,457" fill="none" stroke="#126b83" stroke-width="3" marker-end="url(#arrow)"/><text x="399" y="427" font-size="23" font-weight="600" fill="#162b3d" text-anchor="middle">加水</text><rect x="465" y="385" width="600" height="144" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><circle cx="540" cy="428" r="12" fill="#126b83"/><circle cx="540" cy="486" r="12" fill="#126b83"/><circle cx="690" cy="428" r="12" fill="#126b83"/><circle cx="690" cy="486" r="12" fill="#126b83"/><circle cx="840" cy="428" r="12" fill="#126b83"/><circle cx="840" cy="486" r="12" fill="#126b83"/><circle cx="990" cy="428" r="12" fill="#126b83"/><circle cx="990" cy="486" r="12" fill="#126b83"/><text x="765" y="572" font-size="25" font-weight="700" fill="#162b3d" text-anchor="middle">同一 n；最终 V 增大；c 减小</text><rect x="32" y="615" width="1136" height="70" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="56" y="659" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">图中圆点代表“溶质计量份额”，不是实际粒子，更不是 NaCl 分子。</text></svg>