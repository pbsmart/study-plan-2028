<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="610" viewBox="0 0 1000 610" role="img" aria-labelledby="t d"><title id="t">位置图的线不是物体走过的路线</title><desc id="d">x-t图依次连接(0秒,2米)、(2秒,6米)、(4秒,6米)、(6秒,0米)，右侧另画真实水平位置轴。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.head{font-size:26px;font-weight:bold}.small{font-size:15px}.axis{fill:none;stroke:#718397;stroke-width:1.5}.blue{fill:#2167b2}.orange{fill:#b65c13}.line{fill:none;stroke:#2167b2;stroke-width:3}.dash{stroke-dasharray:5 4}.box{fill:#f2f6fb;stroke:#adbcc9}</style><rect width="1000" height="610" fill="white"/><text x="30" y="40" class="head">位置图记录变化，图线不是运动轨迹</text><text x="30" y="70" class="small">左图横轴是时间；右图才是实际的一维位置轴。</text><path d="M65 140L65 480" class="axis"/><path d="M65 480.0L495 480.0" class="axis"/><text x="60" y="125" class="small">x / m</text><text x="475" y="515.0" class="small">t / s</text><path d="M65.0 476.0L65.0 484.0" class="axis"/><text x="65.0" y="503.0" class="small" text-anchor="middle">0</text><path d="M197.31 476.0L197.31 484.0" class="axis"/><text x="197.31" y="503.0" class="small" text-anchor="middle">2</text><path d="M329.62 476.0L329.62 484.0" class="axis"/><text x="329.62" y="503.0" class="small" text-anchor="middle">4</text><path d="M461.92 476.0L461.92 484.0" class="axis"/><text x="461.92" y="503.0" class="small" text-anchor="middle">6</text><path d="M61 480.0L69 480.0" class="axis"/><text x="55" y="485.0" class="small" text-anchor="end">0</text><path d="M61 382.86L69 382.86" class="axis"/><text x="55" y="387.86" class="small" text-anchor="end">2</text><path d="M61 285.71L69 285.71" class="axis"/><text x="55" y="290.71" class="small" text-anchor="end">4</text><path d="M61 188.57L69 188.57" class="axis"/><text x="55" y="193.57" class="small" text-anchor="end">6</text><path d="M65 382.86L197.31 188.57L329.62 188.57L461.92 480" class="line"/><circle cx="65.0" cy="382.86" r="4" fill="#2167b2"/><circle cx="197.31" cy="188.57" r="4" fill="#2167b2"/><circle cx="329.62" cy="188.57" r="4" fill="#2167b2"/><circle cx="461.92" cy="480.0" r="4" fill="#2167b2"/><text x="90" y="330" class="blue">位置增加</text><text x="225" y="170">位置不变</text><text x="390" y="285" class="orange">位置减少</text><text x="585" y="160">0—2 s：2 m → 6 m</text><path d="M600 190L930 190" class="axis"/><path d="M600 186L600 194" class="axis"/><text x="600" y="213" class="small" text-anchor="middle">0</text><path d="M700 186L700 194" class="axis"/><text x="700" y="213" class="small" text-anchor="middle">2</text><path d="M900 186L900 194" class="axis"/><text x="900" y="213" class="small" text-anchor="middle">6</text><path d="M700 190L900 190" fill="none" stroke="#2167b2" stroke-width="2.5"/><path d="M900 190L891.0 186.0L891.0 194.0Z" fill="#2167b2"/><text x="585" y="280">2—4 s：停在6 m</text><path d="M600 310L930 310" class="axis"/><path d="M600 306L600 314" class="axis"/><text x="600" y="333" class="small" text-anchor="middle">0</text><path d="M700 306L700 314" class="axis"/><text x="700" y="333" class="small" text-anchor="middle">2</text><path d="M900 306L900 314" class="axis"/><text x="900" y="333" class="small" text-anchor="middle">6</text><circle cx="900" cy="310" r="4" fill="#2167b2"/><text x="585" y="400">4—6 s：6 m → 0 m</text><path d="M600 430L930 430" class="axis"/><path d="M600 426L600 434" class="axis"/><text x="600" y="453" class="small" text-anchor="middle">0</text><path d="M700 426L700 434" class="axis"/><text x="700" y="453" class="small" text-anchor="middle">2</text><path d="M900 426L900 434" class="axis"/><text x="900" y="453" class="small" text-anchor="middle">6</text><path d="M900 430L600 430" fill="none" stroke="#b65c13" stroke-width="2.5"/><path d="M600 430L609.0 434.0L609.0 426.0Z" fill="#b65c13"/><text x="920" y="485" class="small">x / m</text><text x="40" y="566">位置由正变小，不等于已在原点左侧；运动方向要看位置如何随时间变化。</text></svg>