 <title id="math-output-witness-title">输出边界要找允许输入作见证</title><desc id="math-output-witness-desc">y=x²只保留−2&lt;x≤2。左端(−2,4)空心，但右端(2,4)实心，所以输出4仍属于值域；输入0产生最小输出0，值域[0,4]。</desc><metadata>
