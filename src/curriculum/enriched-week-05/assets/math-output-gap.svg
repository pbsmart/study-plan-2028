 <title id="math-output-gap-title">分段函数的输出可能有缺口</title><desc id="math-output-gap-desc">教学规则：−2≤x&lt;0时y=x，0≤x≤2时y=x+2。第一段输出[−2,0)，第二段[2,4]，0≤y&lt;2这一整段没有输出。x=0只对应2，不能在两个分支之间补竖线。</desc><metadata>
