ass="axis"/><text x="65" y="252.69" class="small" text-anchor="end">1</text><path d="M71 180.38L79 180.38" class="axis"/><text x="65" y="185.38" class="small" text-anchor="end">2</text><path d="M75 180.38L665.91 449.62" class="line"/><circle cx="75.0" cy="180.38" r="4" fill="#2167b2"/><circle cx="370.45" cy="315.0" r="4" fill="#2167b2"/><circle cx="665.91" cy="449.62" r="4" fill="#2167b2"/><text x="134.09" y="267.88" class="blue">+2 m</text><text x="518.18" y="368.85" class="orange">−2 m</text><text x="360" y="145">2 s：正→负，转向</text><path d="M400 160L370.45 315" fill="none" stroke="#718397" stroke-width="2.5"/><path d="M370.45 315L376.1 306.9L368.2 305.4Z" fill="#718397"/><text x="780" y="220">位移</text><text x="780" y="258" class="blue">2−2=0 m</text><text x="780" y="350">路程</text><text x="780" y="388" class="orange">2+2=4 m</text><text x="40" y="563">速度图面积单位：(m/s) × s = m；不是m²，也不是位置图下面的面积。</text></svg>