<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">分母跟着定义走：溶液体积与溶液质量</title><desc id="desc">两条路线并列：物质的量浓度c等于指定溶质n除以最终溶液体积V，单位mol/L；溶质质量分数w等于溶质质量除以整个溶液质量，无单位，可写百分数。二者之间需要摩尔质量和溶液密度搭桥。</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,1 L8,5 L0,9 Z" fill="#126b83"/></marker></defs><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="52" font-size="34" font-weight="700" fill="#162b3d" text-anchor="start">分母跟着定义走：溶液体积与溶液质量</text><text x="32" y="96" font-size="25" font-weight="400" fill="#162b3d" text-anchor="start">先读所求量，再选分子与分母。</text><rect x="32" y="130" width="550" height="316" rx="16" fill="#f1f7fa" stroke="#94aab9" stroke-width="2"/><rect x="618" y="130" width="550" height="316" rx="16" fill="#e7f3ec" stroke="#94aab9" stroke-width="2"/><text x="307" y="178" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">物质的量浓度 c</text><text x="893" y="178" font-size="29" font-weight="700" fill="#162b3d" text-anchor="middle">溶质质量分数 w</text><text x="307" y="242" font-size="30" font-weight="600" fill="#162b3d" text-anchor="middle">n（指定溶质）</text><path d="M115,261 L500,261" stroke="#162b3d" stroke-width="2"/><text x="307" y="308" font-size="30" font-weight="700" fill="#126b83" text-anchor="middle">V（最终溶液）</text><text x="893" y="242" font-size="30" font-weight="600" fill="#162b3d" text-anchor="middle">m（溶质）</text><path d="M701,261 L1086,261" stroke="#162b3d" stroke-width="2"/><text x="893" y="308" font-size="30" font-weight="700" fill="#126b83" text-anchor="middle">m（整个溶液）</text><text x="307" y="378" font-size="27" font-weight="700" fill="#162b3d" text-anchor="middle">单位：mol/L</text><text x="893" y="378" font-size="27" font-weight="700" fill="#162b3d" text-anchor="middle">无量纲，可写百分数</text><text x="307" y="417" font-size="23" font-weight="400" fill="#162b3d" text-anchor="middle">V 不是水的体积</text><text x="893" y="417" font-size="23" font-weight="400" fill="#162b3d" text-anchor="middle">分母包含溶质与溶剂的质量</text><rect x="32" y="483" width="1136" height="111" rx="16" fill="#fff2df" stroke="#94aab9" stroke-width="2"/><text x="60" y="526" font-size="25" font-weight="600" fill="#162b3d" text-anchor="start">两种定义之间换算，通常还需要：M（摩尔质量）与 ρ（溶液密度）。</text><text x="60" y="567" font-size="24" font-weight="400" fill="#162b3d" text-anchor="start">先逐步搭桥，不把百分数直接读成 mol/L；也不擅自把 ρ 取为 1。</text></svg>