<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="w7-chem-3-title w7-chem-3-desc"><title id="w7-chem-3-title">同一批电子：两边相等，只计一次</title><desc id="w7-chem-3-desc">电子量等于实际反应粒子mol乘每份变价原子数乘每原子变价大小。还原剂失q mol、氧化剂得同一q mol，总转移q mol，不相加成2q。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">同一批电子：两边相等，只计一次</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">每份有几个变价原子，要从化学式下标数清楚。</text><rect x="42" y="123" width="1116" height="133" rx="12" fill="white" stroke="#D9E1EA"/><text x="600" y="171" font-size="27" fill="#2167B2" text-anchor="middle" font-weight="700">n(e⁻) = n(实际反应粒子) × 每份变价原子数 × 每原子变化大小</text><text x="600" y="219" font-size="23" fill="#20334A" text-anchor="middle">Cl₂ → 2Cl⁻：每份 2 个 Cl，各从 0 降到 −1；每 mol Cl₂ 得 2 mol e⁻。</text><rect x="42" y="307" width="425" height="139" rx="12" fill="white" stroke="#D9E1EA"/><rect x="733" y="307" width="425" height="139" rx="12" fill="white" stroke="#D9E1EA"/><text x="254" y="362" font-size="29" fill="#20334A" text-anchor="middle" font-weight="700">还原剂失去</text><text x="254" y="408" font-size="29" fill="#2167B2" text-anchor="middle" font-weight="700">q mol e⁻</text><text x="946" y="362" font-size="29" fill="#20334A" text-anchor="middle" font-weight="700">氧化剂得到</text><text x="946" y="408" font-size="29" fill="#2167B2" text-anchor="middle" font-weight="700">q mol e⁻</text><line x1="495" y1="377" x2="702" y2="377" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="600" y="339" font-size="25" fill="#2167B2" text-anchor="middle" font-weight="700">同一批</text><rect x="42" y="496" width="1116" height="116" rx="12" fill="#FFF3E5" stroke="#D9E1EA"/><text x="600" y="543" font-size="29" fill="#20334A" text-anchor="middle" font-weight="700">转移量 = 失去量 = 得到量 = q mol</text><text x="600" y="583" font-size="24" fill="#20334A" text-anchor="middle">不能相加成 2q；过量未反应的部分不计入电子量。</text></g></svg>
