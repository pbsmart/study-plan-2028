<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w7-physics-fig4-title w7-physics-fig4-desc"><title id="w7-physics-fig4-title">例4解析：同轴先相加，合力再勾股</title><desc id="w7-physics-fig4-desc">答案图：10牛斜力分解为8牛向右、6牛向上；合上6牛向左后总分量(2,6)牛，合力2√10牛。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">例4解析：同轴先相加，合力再勾股</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">答案用图：仅在例4展开答案后显示。不能把斜力10 N直接减水平6 N。</text><line x1="290" y1="475" x2="575" y2="475" stroke="#718397" stroke-width="1.5" marker-end="url(#gray)"/><line x1="290" y1="475" x2="290" y2="215" stroke="#718397" stroke-width="1.5" marker-end="url(#gray)"/><line x1="810" y1="475" x2="985" y2="475" stroke="#718397" stroke-width="1.5" marker-end="url(#gray)"/><line x1="810" y1="475" x2="810" y2="215" stroke="#718397" stroke-width="1.5" marker-end="url(#gray)"/><line x1="290" y1="475" x2="530" y2="295" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><line x1="290" y1="475" x2="110" y2="475" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><line x1="530" y1="475" x2="530" y2="295" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><line x1="530" y1="295" x2="290" y2="295" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><text x="422" y="332" font-size="23" fill="#2167B2" text-anchor="start">10 N</text><text x="132" y="445" font-size="20" fill="#D27627" text-anchor="start">6 N向左</text><text x="530" y="509" font-size="19" fill="#2167B2" text-anchor="middle">+8 N</text><text x="274" y="292" font-size="19" fill="#2167B2" text-anchor="end">+6 N</text><text x="290" y="509" font-size="18" fill="#718397" text-anchor="middle">0</text><text x="570" y="540" font-size="17" fill="#718397" text-anchor="end">水平 / N</text><line x1="810" y1="475" x2="880" y2="265" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><line x1="880" y1="475" x2="880" y2="265" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><line x1="880" y1="265" x2="810" y2="265" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><text x="880" y="509" font-size="19" fill="#2167B2" text-anchor="middle">+2 N</text><text x="790" y="265" font-size="19" fill="#2167B2" text-anchor="end">+6 N</text><text x="909" y="328" font-size="22" fill="#2167B2" text-anchor="start">合力 2√10 N</text><text x="810" y="509" font-size="18" fill="#718397" text-anchor="middle">0</text><text x="983" y="540" font-size="17" fill="#718397" text-anchor="end">水平 / N</text><text x="292" y="184" font-size="17" fill="#718397" text-anchor="start">竖直 / N</text><text x="810" y="184" font-size="17" fill="#718397" text-anchor="start">竖直 / N</text><text x="55" y="609" font-size="23" fill="#2167B2" text-anchor="start">F_x = 8 − 6 = 2 N；F_y = 6 N；右偏上θ，tanθ = 6/2 = 3。</text></g></svg>
