<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="t d"><title id="t">根切数轴，逐个因子判断正负</title><desc id="d">教学符号表：(x+1)(x−3)在−1与3两根外为正，中间为负，两根处0。整体乘−1后非零符号全部反转。正负源于因子符号，不是无条件记两根之间。</desc><style>text{font:18px "Noto Sans CJK SC",sans-serif;fill:#20334a}.h{font-size:25px;font-weight:bold}.s{font-size:15px}.axis{fill:none;stroke:#738496;stroke-width:1.3}.curve{fill:none;stroke:#2167b2;stroke-width:3}.orange{fill:none;stroke:#b65c13;stroke-width:3}.box{fill:#f4f7fb;stroke:#b4c1cf}</style><rect width="1000" height="600" fill="white"/><text x="28" y="38" class="h">根切数轴，逐个因子判断正负</text><text x="30" y="77">先看根、首项系数与不等号，再决定取哪一段。</text><rect x="35" y="110" width="930" height="360" rx="8" class="box"/><text x="265.0" y="150" text-anchor="middle">x&lt;−1</text><text x="405.0" y="150" text-anchor="middle">x=−1</text><text x="555.0" y="150" text-anchor="middle">−1&lt;x&lt;3</text><text x="710.0" y="150" text-anchor="middle">x=3</text><text x="855.0" y="150" text-anchor="middle">x&gt;3</text><text x="55" y="210">x+1</text><text x="265.0" y="210" text-anchor="middle">−</text><text x="405.0" y="210" text-anchor="middle">0</text><text x="555.0" y="210" text-anchor="middle">+</text><text x="710.0" y="210" text-anchor="middle">+</text><text x="855.0" y="210" text-anchor="middle">+</text><text x="55" y="270">x−3</text><text x="265.0" y="270" text-anchor="middle">−</text><text x="405.0" y="270" text-anchor="middle">−</text><text x="555.0" y="270" text-anchor="middle">−</text><text x="710.0" y="270" text-anchor="middle">0</text><text x="855.0" y="270" text-anchor="middle">+</text><text x="55" y="330">两因子乘积</text><text x="265.0" y="330" text-anchor="middle">+</text><text x="405.0" y="330" text-anchor="middle">0</text><text x="555.0" y="330" text-anchor="middle">−</text><text x="710.0" y="330" text-anchor="middle">0</text><text x="855.0" y="330" text-anchor="middle">+</text><text x="55" y="410">乘积整体取负</text><text x="265.0" y="410" text-anchor="middle">−</text><text x="405.0" y="410" text-anchor="middle">0</text><text x="555.0" y="410" text-anchor="middle">+</text><text x="710.0" y="410" text-anchor="middle">0</text><text x="855.0" y="410" text-anchor="middle">−</text><path d="M45 170L955 170" class="axis"/><path d="M45 235L955 235" class="axis"/><path d="M45 295L955 295" class="axis"/><path d="M45 355L955 355" class="axis"/><text x="35" y="530">&lt; 或 &gt; 排除零点；≤ 或 ≥ 可取零点，但还须满足原定义域。</text></svg>