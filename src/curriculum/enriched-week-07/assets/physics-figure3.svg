<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w7-physics-fig3-title w7-physics-fig3-desc"><title id="w7-physics-fig3-title">斜面重力：两个θ来自垂直关系</title><desc id="w7-physics-fig3-desc">向右上升30度斜面，物块处重力竖直向下；重力分解为左下沿坡和右下法向，两分量共同构成以重力为对角线的平行四边形。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">斜面重力：两个θ来自垂直关系</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">左图为辅助分解；右图把力三角形旋转后认边。分量不是新增实际力。</text><line x1="100" y1="450" x2="650" y2="132" stroke="#718397" stroke-width="3"/><line x1="100" y1="450" x2="240" y2="450" stroke="#718397" stroke-width="2"/><path d="M170 450 A70 70 0 0 0 160.6 415" stroke="#237C66" stroke-width="2" fill="none"/><text x="181" y="432" font-size="22" fill="#237C66" text-anchor="start">θ</text><circle cx="360" cy="300" r="5" fill="#20334A"/><line x1="360" y1="300" x2="360" y2="525" stroke="#D27627" stroke-width="3" marker-end="url(#orange)"/><line x1="360" y1="300" x2="262.57" y2="356.25" stroke="#2167B2" stroke-width="2.5" marker-end="url(#blue)"/><line x1="360" y1="300" x2="457.43" y2="468.75" stroke="#237C66" stroke-width="2.5" marker-end="url(#green)"/><line x1="262.57" y1="356.25" x2="360" y2="525" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><line x1="457.43" y1="468.75" x2="360" y2="525" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><path d="M360 355 A55 55 0 0 0 387.5 347.63" stroke="#D27627" stroke-width="2" fill="none"/><text x="378" y="378" font-size="22" fill="#D27627" text-anchor="start">θ</text><text x="172" y="321" font-size="19" fill="#2167B2" text-anchor="start">G_沿：下坡</text><text x="464" y="449" font-size="19" fill="#237C66" text-anchor="start">G_垂：坡内</text><text x="331" y="558" font-size="20" fill="#D27627" text-anchor="middle">G：竖直向下</text><path d="M790 440 L1040 440 L1040 295.66 Z" stroke="#2167B2" stroke-width="3" fill="none"/><path d="M1017 440 L1017 417 L1040 417" stroke="#718397" stroke-width="2" fill="none"/><path d="M848 440 A58 58 0 0 0 840.23 411" stroke="#D27627" stroke-width="2" fill="none"/><text x="860" y="425" font-size="22" fill="#D27627" text-anchor="start">θ</text><text x="925" y="477" font-size="20" fill="#237C66" text-anchor="middle">邻边：Gcosθ</text><text x="1055" y="352" font-size="18" fill="#2167B2" text-anchor="start">对边</text><text x="1055" y="382" font-size="18" fill="#2167B2" text-anchor="start">Gsinθ</text><text x="900" y="333" font-size="22" fill="#D27627" text-anchor="start">斜边G</text><text x="43" y="614" font-size="20" fill="#20334A" text-anchor="start">法向邻边用cos；沿坡对边用sin。G_垂不是支持力N的另一个名字。</text></g></svg>
