<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w7-physics-fig1-title w7-physics-fig1-desc"><title id="w7-physics-fig1-title">直角三角形：先认角，再认边</title><desc id="w7-physics-fig1-desc">3、4、5直角三角形，底边4、竖边3、斜边5；θ在左下，底边为邻边，竖边为对边。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">直角三角形：先认角，再认边</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">斜边对着90°；相对θ辨认对边、邻边。比值本身没有单位。</text><path d="M130 470 L570 470 L570 140 Z" stroke="#2167B2" stroke-width="3" fill="none"/><path d="M546 470 L546 446 L570 446" stroke="#718397" stroke-width="2" fill="none"/><path d="M190 470 A60 60 0 0 0 178 434" stroke="#D27627" stroke-width="2" fill="none"/><text x="209" y="450" font-size="23" fill="#D27627" text-anchor="start">θ</text><text x="345" y="506" font-size="22" fill="#2167B2" text-anchor="middle">邻边 4</text><text x="588" y="307" font-size="22" fill="#2167B2" text-anchor="start">对边 3</text><text x="340" y="278" font-size="22" fill="#D27627" text-anchor="start">斜边 5</text><text x="582" y="453" font-size="16" fill="#718397" text-anchor="start">90°</text><text x="735" y="190" font-size="22" fill="#20334A" text-anchor="start">sinθ = 对边 / 斜边 = 3/5</text><text x="735" y="270" font-size="22" fill="#20334A" text-anchor="start">cosθ = 邻边 / 斜边 = 4/5</text><text x="735" y="350" font-size="22" fill="#20334A" text-anchor="start">tanθ = 对边 / 邻边 = 3/4</text><text x="735" y="448" font-size="22" fill="#2167B2" text-anchor="start">勾股：3² + 4² = 5²</text><text x="45" y="605" font-size="20" fill="#20334A" text-anchor="start">给定sin、cos后可直接求分量，不要求反求小数角度。</text></g></svg>
