<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="610" viewBox="0 0 1200 610" role="img" aria-labelledby="w7-chem-2-title w7-chem-2-desc"><title id="w7-chem-2-title">反应物叫“剂”，沿同一元素找产物</title><desc id="w7-chem-2-desc">Zn从0升+2，失电子被氧化，是还原剂，Zn²⁺为氧化产物；Cu从+2降0，得电子被还原，反应物Cu²⁺为氧化剂，生成Cu为还原产物。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">反应物叫“剂”，沿同一元素找产物</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">每条链先看自身升降，再解释它对另一方的作用。</text><rect x="42" y="133" width="1116" height="155" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="177" font-size="30" fill="#2167B2" text-anchor="start" font-weight="700">Zn：0 → +2</text><text x="78" y="225" font-size="25" fill="#20334A" text-anchor="start">失电子，自己被氧化</text><line x1="465" y1="205" x2="645" y2="205" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><text x="705" y="177" font-size="29" fill="#20334A" text-anchor="start" font-weight="700">Zn²⁺：氧化产物</text><text x="705" y="225" font-size="25" fill="#20334A" text-anchor="start">左侧 Zn 是还原剂</text><rect x="42" y="320" width="1116" height="155" rx="12" fill="white" stroke="#D9E1EA"/><text x="78" y="364" font-size="30" fill="#237C66" text-anchor="start" font-weight="700">Cu：+2 → 0</text><text x="78" y="412" font-size="25" fill="#20334A" text-anchor="start">得电子，自己被还原</text><line x1="465" y1="392" x2="645" y2="392" stroke="#237C66" stroke-width="3" marker-end="url(#green)"/><text x="705" y="364" font-size="29" fill="#20334A" text-anchor="start" font-weight="700">Cu：还原产物</text><text x="705" y="412" font-size="25" fill="#20334A" text-anchor="start">左侧 Cu²⁺ 是氧化剂</text><text x="600" y="535" font-size="25" fill="#20334A" text-anchor="middle" font-weight="700">“剂”的名称说对方受什么作用；不要把自身变化叫反了。</text><text x="600" y="579" font-size="23" fill="#718397" text-anchor="middle">总反应：Zn + Cu²⁺ → Zn²⁺ + Cu；这里只作纸面计量。</text></g></svg>
