<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="w7-physics-fig2-title w7-physics-fig2-desc"><title id="w7-physics-fig2-title">同一斜力，两种角度基准</title><desc id="w7-physics-fig2-desc">右上斜力及水平/竖直投影，左图标与水平夹θ、右图标与竖直夹α，θ与α互余。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">同一斜力，两种角度基准</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">角从水平量起，水平是邻边；角从竖直量起，竖直是邻边。</text><line x1="110" y1="470" x2="460" y2="470" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><line x1="110" y1="470" x2="110" y2="160" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><text x="465" y="492" font-size="18" fill="#718397" text-anchor="start">+x</text><text x="92" y="148" font-size="18" fill="#718397" text-anchor="start">+y</text><line x1="110" y1="470" x2="390" y2="260" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><line x1="110" y1="470" x2="390" y2="470" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><line x1="110" y1="470" x2="110" y2="260" stroke="#237C66" stroke-width="2.5" marker-end="url(#green)"/><line x1="390" y1="470" x2="390" y2="260" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><line x1="390" y1="260" x2="110" y2="260" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><text x="280" y="319" font-size="24" fill="#2167B2" text-anchor="start">F</text><line x1="700" y1="470" x2="1050" y2="470" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><line x1="700" y1="470" x2="700" y2="160" stroke="#718397" stroke-width="1.8" marker-end="url(#gray)"/><text x="1055" y="492" font-size="18" fill="#718397" text-anchor="start">+x</text><text x="682" y="148" font-size="18" fill="#718397" text-anchor="start">+y</text><line x1="700" y1="470" x2="980" y2="260" stroke="#2167B2" stroke-width="3" marker-end="url(#blue)"/><line x1="700" y1="470" x2="980" y2="470" stroke="#D27627" stroke-width="2.5" marker-end="url(#orange)"/><line x1="700" y1="470" x2="700" y2="260" stroke="#237C66" stroke-width="2.5" marker-end="url(#green)"/><line x1="980" y1="470" x2="980" y2="260" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><line x1="980" y1="260" x2="700" y2="260" stroke="#718397" stroke-width="2" stroke-dasharray="7 5"/><text x="870" y="319" font-size="24" fill="#2167B2" text-anchor="start">F</text><path d="M174 470 A64 64 0 0 0 161.2 431.6" stroke="#2167B2" stroke-width="2" fill="none"/><text x="186" y="451" font-size="23" fill="#2167B2" text-anchor="start">θ</text><path d="M700 406 A64 64 0 0 1 751.2 431.6" stroke="#2167B2" stroke-width="2" fill="none"/><text x="726" y="390" font-size="23" fill="#2167B2" text-anchor="start">α</text><text x="88" y="565" font-size="24" fill="#2167B2" text-anchor="start">F_x = Fcosθ     F_y = Fsinθ</text><text x="672" y="565" font-size="24" fill="#2167B2" text-anchor="start">F_x = Fsinα     F_y = Fcosα</text></g></svg>
