<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="570" viewBox="0 0 1200 570" role="img" aria-labelledby="w7-chem-1-title w7-chem-1-desc"><title id="w7-chem-1-title">整体电荷 ≠ 元素化合价</title><desc id="w7-chem-1-desc">SO₄²⁻中下标4为O个数，上标2−是整个离子电荷。设S为x，x加4乘−2等于−2，解得S为+6。</desc><defs><marker id="blue" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#2167B2"/></marker><marker id="orange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#D27627"/></marker><marker id="green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#237C66"/></marker><marker id="gray" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#718397"/></marker><marker id="ink" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L8 4 L0 8 Z" fill="#20334A"/></marker></defs><g font-family="Noto Sans CJK SC,sans-serif" fill="#20334A"><rect width="100%" height="100%" fill="#F7F9FC"/><text x="42" y="52" font-size="28" fill="#20334A" text-anchor="start" font-weight="700">整体电荷 ≠ 元素化合价</text><text x="42" y="86" font-size="17" fill="#718397" text-anchor="start">先辨认记号位置，再列“各原子化合价之和”。</text><rect x="42" y="126" width="1116" height="208" rx="12" fill="white" stroke="#D9E1EA"/><text x="98" y="192" font-size="52" fill="#2167B2" text-anchor="start" font-weight="700">SO₄²⁻</text><text x="370" y="176" font-size="25" fill="#20334A" text-anchor="start" font-weight="700">右下 4：每份含 4 个 O 原子</text><text x="370" y="223" font-size="25" fill="#20334A" text-anchor="start" font-weight="700">右上 2−：整个离子的净电荷</text><text x="370" y="274" font-size="25" fill="#20334A" text-anchor="start">设 S 为 x，O 通常为 −2</text><text x="600" y="385" font-size="32" fill="#2167B2" text-anchor="middle" font-weight="700">x + 4 × (−2) = −2  →  x = +6</text><rect x="42" y="423" width="1116" height="100" rx="12" fill="#FFF3E5" stroke="#D9E1EA"/><text x="66" y="462" font-size="24" fill="#20334A" text-anchor="start" font-weight="700">中性物质：代数和为 0；多原子离子：代数和等于整体电荷。</text><text x="66" y="499" font-size="23" fill="#20334A" text-anchor="start">化合价是记账数，不表示硫酸根中真的有游离 S⁶⁺。</text></g></svg>
