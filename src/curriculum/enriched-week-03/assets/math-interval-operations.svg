<line x1="445" y1="325" x2="595" y2="325" stroke="#111" stroke-width="5"/>
<circle cx="445" cy="325" r="7" stroke="#111" stroke-width="2" fill="white"/>
<circle cx="595" cy="325" r="7" stroke="#111" stroke-width="2" fill="white"/>
<text x="30" y="431" class="label">A ∪ B = [−1, 5]</text>
<line x1="220" y1="425" x2="820" y2="425" stroke="#bbb"/>
<line x1="220" y1="420" x2="220" y2="430" stroke="#777"/>
<text x="212" y="457" class="small">-2</text>
<line x1="295" y1="420" x2="295" y2="430" stroke="#777"/>
<text x="287" y="457" class="small">-1</text>
<line x1="370" y1="420" x2="370" y2="430" stroke="#777"/>
<text x="362" y="457" class="small">0</text>
<line x1="445" y1="420" x2="445" y2="430" stroke="#777"/>
<text x="437" y="457" class="small">1</text>
<line x1="520" y1="420" x2="520" y2="430" stroke="#777"/>
