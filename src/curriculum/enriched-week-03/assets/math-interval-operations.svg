<text x="812" y="457" class="small">6</text>
<line x1="295" y1="425" x2="745" y2="425" stroke="#111" stroke-width="5"/>
<circle cx="295" cy="425" r="7" stroke="#111" stroke-width="2" fill="#111"/>
<circle cx="745" cy="425" r="7" stroke="#111" stroke-width="2" fill="#111"/>
<text x="30" y="497" class="">检查 1：在 A、不在 B → 进并集，不进交集。</text>
<text x="30" y="532" class="">检查 3：不在 A、在 B → 进并集，不进交集。</text>
<text x="30" y="566" class="small">注意：只有中间没有缺口时，才能把并集写成一个连续区间。</text>
</svg>