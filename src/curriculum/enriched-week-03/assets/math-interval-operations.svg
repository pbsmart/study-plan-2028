<svg xmlns="http://www.w3.org/2000/svg" width="900" height="590" viewBox="0 0 900 590" role="img" aria-labelledby="title desc">
<title id="title">区间的交集与并集</title>
<desc id="desc">集合A为负一到三，含负一不含三；B为一到五，不含一含五。交集为一到三且两端不含；并集为负一到五且两端都含。右端三不在A但在B，所以在并集中。圆点表示包含，空圈表示不包含。</desc>
<rect width="900" height="590" fill="white"/>
<style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:19px}.title{font-size:26px;font-weight:700}.label{font-weight:700}.small{font-size:17px}</style>
<text x="30" y="40" class="title">同一条数轴，先看各端点归谁</text>
<text x="30" y="75" class="small">实心包含；空心不含。交集要同时满足，并集满足其中至少一个。</text>
<text x="30" y="131" class="label">A = [−1, 3)</text>
<line x1="220" y1="125" x2="820" y2="125" stroke="#bbb"/>
<line x1="220" y1="120" x2="220" y2="130" stroke="#777"/>
<text x="212" y="157" class="small">-2</text>
<line x1="295" y1="120" x2="295" y2="130" stroke="#777"/>
<text x="287" y="157" class="small">-1</text>
<line x1="370" y1="120" x2="370" y2="130" stroke="#777"/>
<text x="362" y="157" class="small">0</text>
<line x1="445" y1="120" x2="445" y2="130" stroke="#777"/>
<text x="437" y="157" class="small">1</text>
<line x1="520" y1="120" x2="520" y2="130" stroke="#777"/>
<text x="512" y="157" class="small">2</text>
<line x1="595" y1="120" x2="595" y2="130" stroke="#777"/>
<text x="587" y="157" class="small">3</text>
<line x1="670" y1="120" x2="670" y2="130" stroke="#777"/>
<text x="662" y="157" class="small">4</text>
<line x1="745" y1="120" x2="745" y2="130" stroke="#777"/>
<text x="737" y="157" class="small">5</text>
<line x1="820" y1="120" x2="820" y2="130" stroke="#777"/>
<text x="812" y="157" class="small">6</text>
<line x1="295" y1="125" x2="595" y2="125" stroke="#111" stroke-width="5"/>
<circle cx="295" cy="125" r="7" stroke="#111" stroke-width="2" fill="#111"/>
<circle cx="595" cy="125" r="7" stroke="#111" stroke-width="2" fill="white"/>
<text x="30" y="231" class="label">B = (1, 5]</text>
<line x1="220" y1="225" x2="820" y2="225" stroke="#bbb"/>
<line x1="220" y1="220" x2="220" y2="230" stroke="#777"/>
<text x="212" y="257" class="small">-2</text>
<line x1="295" y1="220" x2="295" y2="230" stroke="#777"/>
<text x="287" y="257" class="small">-1</text>
<line x1="370" y1="220" x2="370" y2="230" stroke="#777"/>
<text x="362" y="257" class="small">0</text>
<line x1="445" y1="220" x2="445" y2="230" stroke="#777"/>
<text x="437" y="257" class="small">1</text>
<line x1="520" y1="220" x2="520" y2="230" stroke="#777"/>
<text x="512" y="257" class="small">2</text>
<line x1="595" y1="220" x2="595" y2="230" stroke="#777"/>
<text x="587" y="257" class="small">3</text>
<line x1="670" y1="220" x2="670" y2="230" stroke="#777"/>
<text x="662" y="257" class="small">4</text>
<line x1="745" y1="220" x2="745" y2="230" stroke="#777"/>
<text x="737" y="257" class="small">5</text>
<line x1="820" y1="220" x2="820" y2="230" stroke="#777"/>
<text x="812" y="257" class="small">6</text>
<line x1="445" y1="225" x2="745" y2="225" stroke="#111" stroke-width="5"/>
<circle cx="445" cy="225" r="7" stroke="#111" stroke-width="2" fill="white"/>
<circle cx="745" cy="225" r="7" stroke="#111" stroke-width="2" fill="#111"/>
<text x="30" y="331" class="label">A ∩ B = (1, 3)</text>
<line x1="220" y1="325" x2="820" y2="325" stroke="#bbb"/>
<line x1="220" y1="320" x2="220" y2="330" stroke="#777"/>
<text x="212" y="357" class="small">-2</text>
<line x1="295" y1="320" x2="295" y2="330" stroke="#777"/>
<text x="287" y="357" class="small">-1</text>
<line x1="370" y1="320" x2="370" y2="330" stroke="#777"/>
<text x="362" y="357" class="small">0</text>
<line x1="445" y1="320" x2="445" y2="330" stroke="#777"/>
<text x="437" y="357" class="small">1</text>
<line x1="520" y1="320" x2="520" y2="330" stroke="#777"/>
