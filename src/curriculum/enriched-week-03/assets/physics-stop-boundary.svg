<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title desc"><title id="title">教学图：制动结束后沿时间轴静止</title><desc id="desc">速度—时间图从(0秒,12米每秒)直线降到(4秒,0)，之后到6秒沿速度0水平延伸；4秒处是制动与静止的分界。</desc><rect width="900" height="565" fill="white"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:19px}.title{font-size:25px;font-weight:700}.small{font-size:17px}</style>
<text x="30" y="40" class="title">教学图：制动结束后沿时间轴静止</text>
<text x="30" y="74" class="small">原创模型图；图线描述速度随时间怎样变化，不能当作运动轨迹。</text>
<polygon points="145,390.0 585,390.0 145,120.0" fill="#ddd"/>
<line x1="145" y1="390.0" x2="145" y2="95.0" stroke="#111" stroke-width="2"/>
<line x1="130" y1="390.0" x2="843" y2="390.0" stroke="#111" stroke-width="2"/>
<text x="30" y="105" class="">v / (m/s)</text>
<text x="833" y="422.0" class="">t / s</text>
<line x1="145" y1="385.0" x2="145" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="140" y="416.0" class="small">0</text>
<line x1="255" y1="385.0" x2="255" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="250" y="416.0" class="small">1</text>
<line x1="365" y1="385.0" x2="365" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="360" y="416.0" class="small">2</text>
<line x1="475" y1="385.0" x2="475" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="470" y="416.0" class="small">3</text>
<line x1="585" y1="385.0" x2="585" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="580" y="416.0" class="small">4</text>
<line x1="695" y1="385.0" x2="695" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="690" y="416.0" class="small">5</text>
<line x1="805" y1="385.0" x2="805" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="800" y="416.0" class="small">6</text>
<line x1="140" y1="322.5" x2="150" y2="322.5" stroke="#111" stroke-width="2"/>
<text x="107" y="328.5" class="small">3</text>
<line x1="140" y1="255.0" x2="150" y2="255.0" stroke="#111" stroke-width="2"/>
<text x="107" y="261.0" class="small">6</text>
<line x1="140" y1="187.5" x2="150" y2="187.5" stroke="#111" stroke-width="2"/>
<text x="107" y="193.5" class="small">9</text>
<line x1="140" y1="120.0" x2="150" y2="120.0" stroke="#111" stroke-width="2"/>
<text x="107" y="126.0" class="small">12</text>
<line x1="145" y1="120.0" x2="585" y2="390.0" stroke="#111" stroke-width="4"/>
<line x1="585" y1="390.0" x2="805" y2="390.0" stroke="#111" stroke-width="4"/>
<circle cx="145" cy="120.0" r="5" fill="#111"/>
<circle cx="585" cy="390.0" r="5" fill="#111"/>
<circle cx="805" cy="390.0" r="5" fill="#111"/>
<line x1="585" y1="390.0" x2="585" y2="120.0" stroke="#aaa" stroke-width="1" stroke-dasharray="6 5"/>
<text x="600" y="340" class="">静止：v = 0</text>
<text x="600" y="369" class="">a = 0</text>
<text x="30" y="473" class="">0—4 s：制动模型有效；4 s 停止后要换模型。</text>
<text x="30" y="512" class="small">4—6 s 不再沿原直线向下延伸，否则会误算出反向运动。</text>
</svg>