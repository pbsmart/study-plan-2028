<svg xmlns="http://www.w3.org/2000/svg" width="900" height="565" viewBox="0 0 900 565" role="img" aria-labelledby="title desc"><title id="title">教学图：速度直线下的梯形</title><desc id="desc">横轴时间t，单位秒；纵轴速度v，单位米每秒。一条直线从(0,2)连接到(4,6)，图线下方至时间轴的梯形分为高2、宽4的矩形和额外高度4、宽4的三角形。</desc><rect width="900" height="565" fill="white"/><style>text{font-family:"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#111;font-size:19px}.title{font-size:25px;font-weight:700}.small{font-size:17px}</style>
<text x="30" y="40" class="title">教学图：速度直线下的梯形</text>
<text x="30" y="74" class="small">原创模型图；图线描述速度随时间怎样变化，不能当作运动轨迹。</text>
<polygon points="145.0,390.0 715.0,390.0 715.0,300.0 145.0,300.0" fill="#eee"/>
<polygon points="145.0,300.0 715.0,300.0 715.0,120.0" fill="#d2d2d2"/>
<line x1="145.0" y1="390.0" x2="145.0" y2="95.0" stroke="#111" stroke-width="2"/>
<line x1="130.0" y1="390.0" x2="753.0" y2="390.0" stroke="#111" stroke-width="2"/>
<text x="30" y="105" class="">v / (m/s)</text>
<text x="743.0" y="422.0" class="">t / s</text>
<line x1="145.0" y1="385.0" x2="145.0" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="140.0" y="416.0" class="small">0</text>
<line x1="287.5" y1="385.0" x2="287.5" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="282.5" y="416.0" class="small">1</text>
<line x1="430.0" y1="385.0" x2="430.0" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="425.0" y="416.0" class="small">2</text>
<line x1="572.5" y1="385.0" x2="572.5" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="567.5" y="416.0" class="small">3</text>
<line x1="715.0" y1="385.0" x2="715.0" y2="395.0" stroke="#111" stroke-width="2"/>
<text x="710.0" y="416.0" class="small">4</text>
<line x1="140.0" y1="300.0" x2="150.0" y2="300.0" stroke="#111" stroke-width="2"/>
<text x="107.0" y="306.0" class="small">2</text>
<line x1="140.0" y1="210.0" x2="150.0" y2="210.0" stroke="#111" stroke-width="2"/>
<text x="107.0" y="216.0" class="small">4</text>
<line x1="140.0" y1="120.0" x2="150.0" y2="120.0" stroke="#111" stroke-width="2"/>
<text x="107.0" y="126.0" class="small">6</text>
<line x1="145.0" y1="300.0" x2="715.0" y2="120.0" stroke="#111" stroke-width="4"/>
<circle cx="145.0" cy="300.0" r="5" fill="#111"/>
<circle cx="715.0" cy="120.0" r="5" fill="#111"/>
<line x1="145.0" y1="300.0" x2="715.0" y2="300.0" stroke="#666" stroke-width="1" stroke-dasharray="6 5"/>
<line x1="715.0" y1="390.0" x2="715.0" y2="120.0" stroke="#666" stroke-width="1" stroke-dasharray="6 5"/>
<text x="275" y="350" class="">矩形：2 × 4 = 8 m</text>
<text x="415" y="248" class="">三角形：½ × 4 × 4 = 8 m</text>
<text x="30" y="473" class="">位移 = 梯形面积 = 8 m + 8 m = 16 m</text>
<text x="30" y="512" class="small">也可用平均速度：(2 + 6) / 2 = 4 m/s，再乘 4 s。</text>
</svg>